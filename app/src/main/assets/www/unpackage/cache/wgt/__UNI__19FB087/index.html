<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT 远程显示端</title>
    <link rel="manifest" href="manifest-remote.json">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="观众版">
    <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        // --- TV App Environment Flag ---
        window.isRemoteApp = true;

        // --- 全局兼容性补丁 (针对老电视) ---
        if (!window.fetch) {
            window.fetch = function(url, options) {
                return new Promise(function(resolve, reject) {
                    var xhr = new XMLHttpRequest();
                    xhr.open(options.method || 'GET', url);
                    xhr.onload = function() { resolve({ ok: true, json: function() { return JSON.parse(xhr.responseText); }, text: function() { return xhr.responseText; } }); };
                    xhr.onerror = reject;
                    xhr.send(options.body);
                });
            };
        }

        // --- 全局错误捕获 ---
        window.onerror = function(msg, url, line, col, error) {
            var detail = error ? error.stack : '';
            window.tvLog('JS错误: ' + msg + ' (' + line + ':' + col + ')', 'error');
            return false;
        };

        // TV Debugging Helper
        window.tvLog = function(msg, type) {
            type = type || 'info';
            console.log('[TV-' + type + '] ' + msg);
            var debugPanel = document.getElementById('tv-debug-panel');
            if (debugPanel) {
                var entry = document.createElement('div');
                entry.style.borderBottom = '1px solid #444';
                entry.style.padding = '4px 0';
                entry.style.wordBreak = 'break-all';
                entry.innerHTML = '<span style="color:#aaa;font-size:9px;">[' + new Date().toLocaleTimeString() + ']</span> <span style="color:' + (type === 'error' ? '#ff6666' : (type === 'warn' ? '#ffcc00' : '#66ff66')) + '">' + msg + '</span>';
                debugPanel.insertBefore(entry, debugPanel.firstChild);
            }
        };

        // 网络诊断
        window.runNetworkDiagnostics = function() {
            window.tvLog('开始网络诊断...');
            window.tvLog('UA: ' + navigator.userAgent);
            
            var targets = [
                { name: 'MQTT-Broker', url: 'http://broker.emqx.io:8083' }, // 使用 http 测试连通性
                { name: 'EasyShow-API', url: 'https://easyshow.beundredig.eu.org/api/screen/active-room' }
            ];

            targets.forEach(function(t) {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', t.url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status > 0) window.tvLog('✅ ' + t.name + ' 连通成功');
                        else window.tvLog('❌ ' + t.name + ' 连通失败 (Status 0)', 'error');
                    }
                };
                xhr.send();
            });
        };
    </script>
    <style>
        #tv-debug-panel {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 300px;
            max-height: 200px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 10px;
            font-family: monospace;
            padding: 5px;
            border-radius: 5px;
            z-index: 999999;
            overflow-y: auto;
            pointer-events: none;
            display: none; /* 默认隐藏，按 F8 显示 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 全局现代滚动条样式（深色适用） */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.5);
            border: 2px solid transparent;
            background-clip: content-box;
        }

        /* 顶部状态栏 - 包含页码和全屏控制 */
        .header {
            position: fixed;
            top: 40px;
            right: 40px;
            z-index: 100;
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 5px 10px;
            border-radius: 8px;
            /* 正方形/稍圆角风格 */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 页码信息 */
        .page-info {
            color: white;
            font-size: 14px;
            font-weight: bold;
            font-family: inherit;
        }

        /* 全屏按钮 (兼作状态显示层) */
        .btn-fullscreen {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            /* 正方形风格 */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
            transition: all 0.3s;
            position: relative;
            /* 为了定位状态原点 */
        }

        .btn-fullscreen:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .status-indicator {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
            border: 2px solid rgba(0, 0, 0, 0.8);
            /* 边缘遮罩 */
            transition: all 0.3s;
        }

        /* 已连接 - 绿色 */
        .status-indicator.connected {
            background: #4caf50;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
            animation: pulse 2s infinite;
        }

        /* 连接中 - 黄色闪烁 */
        .status-indicator.connecting {
            background: #ffc107;
            animation: blink 1s infinite;
        }

        /* 错误/断开 - 红色 */
        .status-indicator.error {
            background: #f44336;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7);
            }

            50% {
                box-shadow: 0 0 0 4px rgba(76, 175, 80, 0);
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .status-text {
            color: #fff;
            font-size: 12px;
            opacity: 0.8;
        }

        .btn-disconnect {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn-disconnect:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 全屏预览容器 */
        .preview-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-screen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #agentScreenLayer {
            position: absolute;
            inset: 0;
            z-index: 260;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
        }

        #agentScreenLayer .screen-text {
            width: min(90vw, 1400px);
            max-height: 85vh;
            overflow: auto;
            font-size: clamp(28px, 4vw, 72px);
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            text-align: center;
            padding: 4vh 4vw;
        }

        #agentScreenLayer .screen-media,
        #agentScreenLayer .screen-frame {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
            background: #000;
        }

        #agentScreenLayer .screen-frame svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        #pdfCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 图片显示样式 */
        #imageDisplay {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        /* 视频显示样式 */
        #videoDisplay {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        /* 全屏模式下的优化 */
        body:fullscreen .preview-container,
        body:-webkit-full-screen .preview-container,
        body:-moz-full-screen .preview-container {
            background: #000;
        }

        body:fullscreen #pdfCanvas,
        body:-webkit-full-screen #pdfCanvas,
        body:-moz-full-screen #pdfCanvas {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }

        /* 全屏时隐藏控制按钮（可选） */
        body:fullscreen .header,
        body:-webkit-full-screen .header,
        body:-moz-full-screen .header {
            opacity: 0;
            transition: opacity 0.3s;
        }

        body:fullscreen .header:hover,
        body:-webkit-full-screen .header:hover,
        body:-moz-full-screen .header:hover {
            opacity: 1;
        }

        body:fullscreen .controls-container,
        body:-webkit-full-screen .controls-container,
        body:-moz-full-screen .controls-container {
            opacity: 0;
            transition: opacity 0.3s;
        }

        body:fullscreen .controls-container:hover,
        body:-webkit-full-screen .controls-container:hover,
        body:-moz-full-screen .controls-container:hover {
            opacity: 1;
        }

        .preview-placeholder {
            color: #666;
            text-align: center;
        }

        .preview-placeholder .icon {
            font-size: 64px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* 页码信息已经被并入 header 中，移除悬浮独立的样式，仅作微调如果需要 */

        /* 控制按钮容器 - 左下角悬浮 */
        .controls-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: none;
            /* 默认隐藏，除非主讲人允许 */
            flex-direction: column;
            gap: 15px;
            z-index: 300;
        }

        /* 主控制按钮组 */
        .controls-main {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 跳转控制 - 可展开 */
        .goto-container {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            pointer-events: none;
        }

        .controls-container:hover .goto-container {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .goto-input {
            width: 80px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            text-align: center;
        }

        .goto-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .goto-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-goto {
            padding: 8px 16px;
            background: rgba(103, 126, 234, 0.3);
            border: 1px solid rgba(103, 126, 234, 0.5);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-goto:hover {
            background: rgba(103, 126, 234, 0.5);
        }

        .btn-goto:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .controls-container {
                bottom: 20px;
                right: 20px;
            }

            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .controls-main {
                gap: 10px;
            }
        }

        /* 隐藏标题 */
        .preview-title {
            display: none;
        }

        /* ESC 退出提示 */
        .esc-hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 400;
            opacity: 0;
            opacity: 0;
            animation: fadeInOut 3s ease-in-out;
        }

        @keyframes fadeInOut {

            0%,
            100% {
                opacity: 0;
            }

            10%,
            90% {
                opacity: 1;
            }
        }

        /* 全屏时显示提示 */
        body:fullscreen .esc-hint {
            animation: fadeInOut 3s ease-in-out;
        }

        /* 主题信息显示层 - 透明磨玻璃灰色风格 */
        .tech-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.55);
            backdrop-filter: blur(40px) saturate(0.7);
            -webkit-backdrop-filter: blur(40px) saturate(0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .tech-card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 60px 80px;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .tech-card h1 {
            font-size: 48px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.92);
            margin: 20px 0;
            letter-spacing: 2px;
        }

        .info-meta {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.65);
            margin: 30px 0;
            font-weight: 400;
            letter-spacing: 1px;
        }

        #info-qrcode {
            margin: 40px auto;
            display: inline-block;
            padding: 16px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        #info-url {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5) !important;
            font-family: 'Courier New', monospace !important;
            word-break: break-all;
            padding: 0 20px;
        }

        #placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .pulse-ring-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pulse-ring {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            animation: pulse-ring 3s ease-in-out infinite;
        }

        .pulse-ring-outer {
            position: absolute;
            inset: -16px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 50%;
            animation: pulse-ring 3s ease-in-out infinite 0.5s;
        }

        .pulse-ring-count {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .pulse-ring-count .count-num {
            font-size: 32px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: -1px;
        }

        .pulse-ring-count .count-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 2px;
        }

        .placeholder-title {
            font-size: 22px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .placeholder-sub {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @keyframes pulse-ring {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.12);
                opacity: 0.2;
            }
        }
    </style>

    <style>
        /* --- 观众昵称弹窗 --- */
        #agora-chat-btn {
            display: none !important;
        }

        #nickname-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        #nickname-modal.hidden {
            display: none;
        }

        .nickname-box {
            background: white;
            border-radius: 16px;
            padding: 36px 40px;
            width: 340px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .nickname-title {
            font-size: 22px;
            font-weight: bold;
            color: #1565c0;

        .nickname-sub {

        }

        #nickname-input {

            border: 2px solid #ddd;

        }

        .nickname-btns {

        }

        .btn-enter:hover {

        .btn-skip {

        }

        }
    </style>

    <!-- Agora 独立音视频模块 -->
    <link rel="stylesheet" href="agora-call.css">
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
    <script src="agora-call.js"></script>

    <!-- 引入提取出的玻璃拟态UI样式 -->
    <link rel="stylesheet" href="chat-glass-style.css">
</head>

<body>
    <!-- 电视端调试面板 -->
    <div id="tv-debug-panel"></div>

    <!-- 观众昵称输入弹窗 -->
    <div id="nickname-modal">
        <div class="nickname-box">
            <div class="nickname-title">👋 欢迎加入会议</div>
            <div class="nickname-sub">输入您的昵称，或直接跳过由系统分配编号</div>
            <input id="nickname-input" type="text" placeholder="您的昵称（可不填）" maxlength="16"
                onkeydown="if(event.key==='Enter') confirmNickname()" autocomplete="off">
            <div class="nickname-btns">
                <button class="btn-enter" onclick="confirmNickname()">入場</button>
                <button class="btn-skip" onclick="skipNickname()">-- 跳过，使用随机编号 --</button>
            </div>
        </div>
    </div>

    <!-- 互动讨论侧边栏 -->
    <div id="discussion-sidebar">
        <div class="discussion-content">
            <div class="discussion-header"
                style="cursor:pointer; display:flex; justify-content:space-between; align-items:center; user-select:none;"

        <script>
            window.BASE_URL = 'https://easyshow.beundredig.eu.org'; // 强制绝对路径前缀
            window.BEMFA_KEY = '3eb42d69d8b226abe22024d648975f8a';
            window.MQTT_URL = 'ws://broker.emqx.io:8083/mqtt';
            window.CONTROL_TOPIC = window.BEMFA_KEY + '/PPT001';
            window.STATUS_TOPIC = window.BEMFA_KEY + '/PPT002';
            
            // 使用简写引用
            var BEMFA_KEY = window.BEMFA_KEY;
            var MQTT_URL = window.MQTT_URL;
            var CONTROL_TOPIC = window.CONTROL_TOPIC;
            var STATUS_TOPIC = window.STATUS_TOPIC;

            // 每个标签页独立 Session ID
            if (!sessionStorage.getItem('sync_viewer_id')) {
                sessionStorage.setItem('sync_viewer_id', 'remote_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5));
            }
            var SESSION_ID = sessionStorage.getItem('sync_viewer_id');

            var mqttClient = null;
            var isConnected = false;
            var currentPage = 0;
            var totalPages = 0;
            var pdfDoc = null;
            var currentFilePath = null;
            var viewerControlEnabled = false;
            var pendingVideoUrl = null;
            var lastRemoteFlipAt = 0;
            var screenStatePollTimer = null;
            var lastScreenStateTs = 0;
            var lastRenderedScreenState = null;
            var manualDisplayPriority = false;
            var activeRoomReportTimer = null;
            var screenSelfHealTimer = null;


            // --- UI 基础功能 (优先定义) ---

            // 全屏切换功能
            function toggleFullscreen() {
                console.log('🚀 [Fullscreen] 尝试切换全屏...');

                // 视觉反馈：点击瞬间变红边，确认点击到了
                const btn = document.querySelector('.btn-fullscreen');
                if (btn) {
                    btn.style.outline = '3px solid red';
                    setTimeout(() => btn.style.outline = 'none', 500);
                }

                if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled && !document.mozFullScreenEnabled && !document.msFullscreenEnabled) {
                    alert('当前浏览器或环境禁用了全屏功能，请检查权限。');
                    return;
                }

                try {
                    const isFull = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                    const elem = document.documentElement;

                    if (!isFull) {
                        // 尝试所有可能的进入方法
                        const request = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.mozRequestFullScreen || elem.msRequestFullscreen;
                        if (request) {
                            const p = request.call(elem);
                            if (p && p.catch) {
                                p.catch(err => {
                                    console.error('❌ [Fullscreen] 拦截:', err);
                                    alert('全屏请求被拦截: ' + err.message + '\n\n提示：浏览器通常要求在页面上先有点任何位置的操作，然后再点全屏。');
                                });
                            }
                        } else {
                            alert('当前浏览器版本过低，不支持全屏功能。');
                        }
                    } else {
                        // 退出逻辑
                        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                        if (exit) exit.call(document);
                    }
                } catch (e) {
                    console.error('💥 [Fullscreen] 异常:', e);
                    alert('全屏逻辑异常: ' + e.message);
                }
            }
            window.toggleFullscreen = toggleFullscreen;

            function hideAgentScreenLayer() {
                const layer = document.getElementById('agentScreenLayer');
                if (!layer) return;
                layer.style.display = 'none';
                layer.innerHTML = '';
            }

            function setManualDisplayPriority(active) {
                manualDisplayPriority = !!active;
                if (manualDisplayPriority) {
                    hideAgentScreenLayer();
                } else {
                    pollScreenState();
                }
            }

            function fixUrl(url) {
                if (!url) return '';
                if (url.indexOf('http') === 0) return url;
                if (url.indexOf('//') === 0) return 'https:' + url;
                if (url.indexOf('/') === 0) return window.BASE_URL + url;
                return url;
            }

            function renderAgentScreenState(state) {
                var layer = document.getElementById('agentScreenLayer');
                if (!layer) return;
                
                if (manualDisplayPriority) {
                    layer.style.display = 'none';
                    lastRenderedScreenState = null;
                    return;
                }
                if (!state) {
                    hideAgentScreenLayer();
                    lastRenderedScreenState = null;
                    return;
                }

                // 自动探测类型
                var type = state.type;
                var content = state.url || state.content || '';
                if (!type && content) {
                    if (content.indexOf('<svg') === 0 || (content.indexOf('http') >= 0 && content.toLowerCase().indexOf('.svg') >= 0)) type = 'svg';
                    else if (content.toLowerCase().match(/\.(mp4|webm|ogg|mov)$/)) type = 'video';
                    else if (content.toLowerCase().match(/\.(mp3|wav|aac|m4a)$/)) type = 'audio';
                    else if (content.toLowerCase().match(/\.(jpg|jpeg|png|gif|webp|bmp)$/)) type = 'image';
                    else if (content.indexOf('http') >= 0 || content.indexOf('/api/') === 0) type = 'iframe';
                    else type = 'text';
                }

                window.tvLog('Agent推送 [' + type + ']: ' + String(content).substring(0, 50));

                var fit = state.fit === 'cover' ? 'cover' : 'contain';
                var html = '';
                
                if (type === 'text') {
                    html = '<div class="screen-text">' + String(content).replace(/[&<>]/g, function(s) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[s]; }) + '</div>';
                } else if (type === 'image') {
                    var src = fixUrl(content);
                    html = '<img class="screen-media" style="object-fit:' + fit + ';" src="' + src + '" onerror="window.tvLog(\'图片加载失败\', \'error\')">';
                } else if (type === 'video') {
                    var src = fixUrl(content);
                    html = '<video class="screen-media" style="object-fit:' + fit + ';" src="' + src + '" controls autoplay playsinline onerror="window.tvLog(\'视频加载失败\', \'error\')"></video>';
                } else if (type === 'audio') {
                    var src = fixUrl(content);
                    html = '<div class="screen-text" style="display:flex; flex-direction:column; align-items:center;"><div style="font-size:100px;">🎵</div><div style="font-size:24px; margin-top:20px;">正在播放音频...</div><audio src="' + src + '" controls autoplay style="margin-top:40px; width:600px;" onerror="window.tvLog(\'音频加载失败\', \'error\')"></audio></div>';
                } else if (type === 'svg') {
                    if (content.indexOf('http') >= 0 || content.indexOf('/') === 0) {
                        html = '<img class="screen-media" style="object-fit:' + fit + ';" src="' + fixUrl(content) + '" alt="">';
                    } else {
                        var svgContent = String(content);
                        if (!/preserveAspectRatio\s*=/.test(svgContent)) {
                            var fitMode = (state.fit === 'cover') ? 'slice' : 'meet';
                            svgContent = svgContent.replace(/<svg(\s|>)/i, '<svg preserveAspectRatio="xMidYMid ' + fitMode + '" $1');
                        }
                        if (!/width\s*=/.test(svgContent)) {
                            svgContent = svgContent.replace(/<svg(\s|>)/i, '<svg width="100%" height="100%" $1');
                        }
                        html = '<div class="screen-frame" style="width:100%;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;">' + svgContent + '</div>';
                    }
                } else if (type === 'html' || type === 'iframe') {
                    var src = fixUrl(state.url || content);
                    if (src.indexOf('http') >= 0 || src.indexOf('/') === 0) {
                        html = '<iframe class="screen-frame" src="' + fixUrl(src) + '" style="width:100%;height:100%;border:none;background:#fff;"></iframe>';
                    } else {
                        html = '<div class="screen-frame" style="width:100%;height:100%;background:#000;">' + content + '</div>';
                    }
                } else if (type === 'pdf' || type === 'doc') {
                    html = '<iframe class="screen-frame" src="' + fixUrl(content) + '"></iframe>';
                }

                layer.innerHTML = html;
                layer.style.display = html ? 'flex' : 'none';
                lastRenderedScreenState = state;
                reportScreenRenderAck(state);
            }

            function hashScreenState(state) {
                if (!state) return '';
                var raw = [
                    String(state.roomId || ''),
                    String(state.type || ''),
                    String(state.text || ''),
                    String(state.content || ''),
                    String(state.url || ''),
                    String(state.fit || '')
                ].join('|');
                var h = 2166136261;
                for (var i = 0; i < raw.length; i++) {
                    h ^= raw.charCodeAt(i);
                    h = Math.imul ? Math.imul(h, 16777619) : (h * 16777619);
                }
                return (h >>> 0).toString(16);
            }

            function reportScreenRenderAck(state) {
                try {
                    if (!state || !state.type) return;
                    var roomId = window.STATUS_TOPIC || STATUS_TOPIC || (BEMFA_KEY + '/PPT002');
                    fetch('https://easyshow.beundredig.eu.org/api/screen/render-ack', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            roomId: roomId,
                            hash: hashScreenState(state),
                            clientTs: Date.now(),
                            ok: true,
                            source: 'remote'
                        })
                    });
                } catch (e) { }
            }

            function pollScreenState() {
                try {
                    var roomId = window.STATUS_TOPIC || STATUS_TOPIC || (BEMFA_KEY + '/PPT002');
                    fetch('https://easyshow.beundredig.eu.org/api/screen/state?roomId=' + encodeURIComponent(roomId))
                        .then(function(res) {
                            if (!res.ok) return null;
                            return res.json();
                        })
                        .then(function(data) {
                            var state = data ? data.state : null;
                            var ts = state && state.ts ? Number(state.ts) : 0;
                            if (ts === lastScreenStateTs && state) return;

                            if (ts > 0 && ts !== lastScreenStateTs) {
                                var pptTs = window._pptLastTs || 0;
                                if (ts > pptTs - 2000) {
                                    manualDisplayPriority = false;
                                }
                            }

                            lastScreenStateTs = ts;
                            renderAgentScreenState(state);
                        }).catch(function(err) {});
                } catch (e) { }
            }

            function reportActiveScreenRoom() {
                try {
                    var roomId = window.STATUS_TOPIC || STATUS_TOPIC || (BEMFA_KEY + '/PPT002');
                    fetch('https://easyshow.beundredig.eu.org/api/screen/active-room', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ roomId: roomId, source: 'remote' })
                    });
                } catch (e) { }
            }

            async function triggerScreenSelfHeal() {
                try {
                    const roomId = window.STATUS_TOPIC || STATUS_TOPIC || (BEMFA_KEY + '/PPT002');
                    if (lastRenderedScreenState && lastRenderedScreenState.type) {
                        await reportScreenRenderAck(lastRenderedScreenState);
                    }
                    await fetch(`https://easyshow.beundredig.eu.org/api/screen/self-heal?roomId=${encodeURIComponent(roomId)}`, { method: 'POST' });
                } catch (e) { }
            }

            function startScreenStatePolling() {
                if (screenStatePollTimer) clearInterval(screenStatePollTimer);
                pollScreenState();
                screenStatePollTimer = setInterval(pollScreenState, 1000);
                reportActiveScreenRoom();
                if (activeRoomReportTimer) clearInterval(activeRoomReportTimer);
                activeRoomReportTimer = setInterval(reportActiveScreenRoom, 10000);
                triggerScreenSelfHeal();
                if (screenSelfHealTimer) clearInterval(screenSelfHealTimer);
                screenSelfHealTimer = setInterval(triggerScreenSelfHeal, 3000);
            }

            function stopScreenStatePolling() {
                if (screenStatePollTimer) {
                    clearInterval(screenStatePollTimer);
                    screenStatePollTimer = null;
                }
                if (activeRoomReportTimer) {
                    clearInterval(activeRoomReportTimer);
                    activeRoomReportTimer = null;
                }
                if (screenSelfHealTimer) {
                    clearInterval(screenSelfHealTimer);
                    screenSelfHealTimer = null;
                }
            }

            function stopStatusPolling() {
                stopScreenStatePolling();
            }

            function topicSig(input) {
                let h = 2166136261;
                const text = String(input || '');
                for (let i = 0; i < text.length; i++) {
                    h ^= text.charCodeAt(i);
                    h = Math.imul(h, 16777619);
                }
                return (h >>> 0).toString(16).padStart(8, '0');
            }

            function buildTopicSuffix(baseName) {
                if (!baseName || baseName === 'admin') return '';
                const sig = topicSig(`${BEMFA_KEY}:${baseName}`).slice(0, 8);
                return `_${baseName}_${sig}`;
            }



            // 页面加载后自动连接
            window.addEventListener('load', function() {
                var search = window.location.search;
                var room = '';
                if (search) {
                    var pairs = search.substring(1).split('&');
                    for (var i = 0; i < pairs.length; i++) {
                        var p = pairs[i].split('=');
                        if (p[0] === 'room' || p[0] === 'u') {
                            room = decodeURIComponent(p[1]);
                            break;
                        }
                    }
                }
                var suffix = buildTopicSuffix(room);
                CONTROL_TOPIC = BEMFA_KEY + '/PPT001' + suffix;
                STATUS_TOPIC = BEMFA_KEY + '/PPT002' + suffix;
                window.STATUS_TOPIC = STATUS_TOPIC; 
                startScreenStatePolling();

                // Force stable Chinese labels to avoid any source-file encoding pollution.
                try {
                    const headerLabel = document.querySelector('.discussion-header span span');
                    if (headerLabel) headerLabel.textContent = '讨论屏';
                    const onlineBadge = document.getElementById('online-count-badge');
                    if (onlineBadge && !onlineBadge.textContent.trim()) onlineBadge.textContent = '1 人';
                    const fileBtn = document.querySelector('.discussion-input-area button[type="button"]');
                    if (fileBtn) {
                        fileBtn.title = '发送文件';
                        fileBtn.textContent = '📎';
                    }
                    const msgInput = document.getElementById('discussion-input');
                    if (msgInput) msgInput.placeholder = '输入消息...';
                    const sendBtn = document.querySelector('.discussion-input-area button[onclick="sendChatMessage()"]');
                    if (sendBtn) sendBtn.textContent = '发送';
                    const chatFab = document.getElementById('chat-fab');
                    if (chatFab) {
                        chatFab.title = '聊天';
                        chatFab.textContent = '💬';
                    }
                    const fsBtn = document.querySelector('.btn-fullscreen');
                    if (fsBtn) fsBtn.title = '全屏';
                } catch (e) { }

                // Default close discussion panel.
                const sidebar = document.getElementById('discussion-sidebar');
                if (sidebar) sidebar.classList.remove('active');

                // Ensure remote bottom-right control panel is collapsed by default.
                const tryCollapse = () => {
                    if (typeof window.agoraCollapseCtrlPanel === 'function') {
                        window.agoraCollapseCtrlPanel(true);
                    }
                };
                tryCollapse();
                setTimeout(tryCollapse, 300);
                setTimeout(tryCollapse, 1000);

                var displayName = room || 'admin';
                var welcome = document.getElementById('welcome-title');
                if (welcome) welcome.textContent = room ? ('HELLO, ' + displayName.toUpperCase()) : 'SYSTEM ONLINE';

                // --- TV 优化：自动进入并连接 ---
                if (window.isRemoteApp) {
                    window.tvLog('📺 TV模式探测成功: 准备自动进入...');
                    setTimeout(function() {
                        window.tvLog('🚀 正在执行自动跳过登录...');
                        skipNickname();
                        runNetworkDiagnostics();
                    }, 800); 
                }

                // 点击后门：连续点击左上角 5 次开启/关闭日志
                let clickCount = 0;
                let lastClickAt = 0;
                document.addEventListener('click', function(e) {
                    if (e.clientX < 100 && e.clientY < 100) {
                        var now = Date.now();
                        if (now - lastClickAt > 1000) clickCount = 0;
                        clickCount++;
                        lastClickAt = now;
                        if (clickCount >= 5) {
                            var panel = document.getElementById('tv-debug-panel');
                            if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
                            window.tvLog('调试面板已通过手势切换');
                            clickCount = 0;
                        }
                    }
                });
            });

            // --- 全局安全防护 (显示端强制开启) ---
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F8') {
                    var panel = document.getElementById('tv-debug-panel');
                    if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
                }

                if (e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                    (e.ctrlKey && e.key === 'u') ||
                    (e.ctrlKey && e.key === 's')
                ) {
                    e.preventDefault();
                }
            });

            // --- 互动讨论逻辑 ---
            var onlineUsers = {}; // 改用普通对象提高兼容性
            var isIdAssigned = false;

            // --- 昵称弹窗逻辑 ---
            function confirmNickname() {
                var input = document.getElementById('nickname-input');
                var name = input ? input.value.trim() : '';
                if (name) {
                    window.sessionUsername = name;
                } else {
                    skipNickname();
                    return;
                }
                var modal = document.getElementById('nickname-modal');
                if (modal) modal.style.display = 'none';
                connectMQTT();
            }

            function skipNickname() {
                var animals = ["百灵鸟", "小海豚", "胖达", "小白兔", "小柯基", "小花猫", "小仓鼠", "小企鹅", "长颈鹿", "小松鼠", "小刺猬", "小考拉", "小狐狸", "小斑马", "小浣熊"];
                var animal = animals[Math.floor(Math.random() * animals.length)];

            function handleDiscussionFileUpload(input) {
                var file = input.files[0];
                if (!file) return;
                input.value = ''; 

                addMessageToUI({ text: '正在上传文件: ' + file.name + '...', sender: '系统', action: 'chat', timestamp: Date.now() }, false);

                var reader = new FileReader();
                reader.onload = function(e) {
                    var arrayBuffer = e.target.result;
                    fetch('https://easyshow.beundredig.eu.org/api/chat/upload?filename=' + encodeURIComponent(file.name), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/octet-stream' },
                        body: arrayBuffer
                    }).then(function(res) {
                        return res.json();
                    }).then(function(result) {
                        if (result.success && result.url) {
                            var imgExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'];
                            var ext = file.name.split('.').pop().toLowerCase();
                            var isImage = false;
                            for (var i = 0; i < imgExts.length; i++) {
                                if (imgExts[i] === ext) { isImage = true; break; }
                            }

                            var fileMsg = {
                                roomId: STATUS_TOPIC,
                                action: isImage ? 'chat_image' : 'file_link',
                                sender: window.sessionUsername || '观众',
                                sessionId: SESSION_ID,
                                fileName: file.name,
                                fileSize: (file.size / 1024).toFixed(1) + ' KB',
                                url: result.url,
                                imageUrl: isImage ? result.url : undefined,
                                timestamp: Date.now()
                            };
                            if (window.mqttClient) {
                                window.mqttClient.publish(STATUS_TOPIC, JSON.stringify(fileMsg));
                            }
                            addMessageToUI(fileMsg, true);
                        } else {
                            addMessageToUI({ text: '文件上传失败', sender: '系统', action: 'chat', timestamp: Date.now() }, false);
                        }
                    }).catch(function(err) {
                        addMessageToUI({ text: '上传异常', sender: '系统', action: 'chat', timestamp: Date.now() }, false);
                    });
                };
                reader.readAsArrayBuffer(file);
            }

            function stringToColor(str) {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = str.charCodeAt(i) + ((hash << 5) - hash);
                }
                const h = Math.abs(hash) % 360;
                return `hsl(${h}, 70%, 50%)`;
            }

            // MQTT-based heartbeat
            function startMqttPresenceHeartbeat() {
                setInterval(() => {
                    if (!STATUS_TOPIC || !window.mqttClient) return;
                    window.mqttClient.publish(STATUS_TOPIC, JSON.stringify({
                        action: 'presence',
                        sessionId: SESSION_ID,
                        name: window.sessionUsername || '观众',
                        role: 'viewer'
                    }));

                    // Cleanup stale users (>15s)
                    const now = Date.now();
                    let changed = false;
                    for (const [sid, user] of onlineUsers.entries()) {
                        if (now - user.time > 15000) {
                            onlineUsers.delete(sid);
                            changed = true;
                        }
                    }
                    if (changed) updateOnlineStatusUI();
                }, 5000);
            }
            setTimeout(startMqttPresenceHeartbeat, 2000);

            function connectMQTT() {
                if (typeof mqtt === 'undefined') {
                    window.tvLog('❌ 致命错误: MQTT 库加载失败 (请检查网络或 HTTPS 证书)', 'error');
                    console.error('MQTT library not loaded');
                    return;
                }

                if (mqttClient) {
                    try { mqttClient.end(); } catch(e) {}
                }

                updateStatus('连接中...', false);
                window.tvLog('🔌 尝试连接: ' + MQTT_URL);

                try {
                    var search = window.location.search;
                    var sessionUsername = window.sessionUsername;
                    if (!sessionUsername && search) {
                        var pairs = search.substring(1).split('&');
                        for (var i = 0; i < pairs.length; i++) {
                            var p = pairs[i].split('=');
                            if (p[0] === 'u' || p[0] === 'room') {
                                sessionUsername = decodeURIComponent(p[1]);
                                break;
                            }
                        }
                    }
                    if (!sessionUsername) {
                        var animals = ["百灵鸟", "小海豚", "胖达", "小白兔", "小柯基"];
                        var animal = animals[Math.floor(Math.random() * animals.length)];
                        var rand = Math.random().toString(36).substr(2, 4).toUpperCase();
                        sessionUsername = animal + '_' + rand;
                    }
                    window.sessionUsername = sessionUsername;

                    window.mqttClient = mqttClient = mqtt.connect(MQTT_URL, {
                        clientId: SESSION_ID,
                        clean: true,
                        connectTimeout: 5000,
                        reconnectPeriod: 5000, 
                        protocolId: 'MQIsdp', // 老旧设备尝试使用协议 ID
                        protocolVersion: 3
                    });

                    mqttClient.on('connect', function() {
                        window.tvLog('✅ 服务器连接成功');
                        isConnected = true;
                        updateStatus('已连接', true);
                        updateStatusUI();
                        startScreenStatePolling();
                        
                        mqttClient.subscribe(STATUS_TOPIC, function(err) {
                            if (!err) {
                                enableControls(viewerControlEnabled);
                                requestStatus();
                                console.log('📢 正在请求席位编号...');
                                mqttClient.publish(STATUS_TOPIC, JSON.stringify({
                                    action: 'request_id',
                                    sessionId: SESSION_ID
                                }), { qos: 0 });

                                setTimeout(function() {
                                    if (!isIdAssigned) {
                                        console.log('⚠️ 未收到编号分配，自行抢坑...');
                                        var usedIds = new Set();
                                        onlineUsers.forEach(function(u) {
                                            var m = u.name.match(/_(\d+)$/);
                                            if (m) usedIds.add(parseInt(m[1]));
                                        });
                                        var assigned = 2;
                                        while (usedIds.has(assigned)) assigned++;
                                        var assignedStr = assigned < 10 ? '0' + assigned : '' + assigned;
                                        completeIdAssignment(assignedStr);
                                    }
                                }, 1500);
                            }
                        });
                    });

                    function completeIdAssignment(idStr) {
                        if (isIdAssigned) return;
                        isIdAssigned = true;
                        console.log('✅ 席位确认:', window.sessionUsername);
                    }

                    window.isPresenterOnline = false;
                    window.isViewerSharingAllowed = true;
                    window.isViewerMicAllowed = true;
                    window.isViewerVideoAllowed = true;

                    function updateSharingPermission() {
                        if (window.agoraModule && typeof window.agoraModule.setSharingPermission === 'function') {
                            window.agoraModule.setSharingPermission(window.isPresenterOnline, window.isViewerSharingAllowed);
                        }
                    }

                    setInterval(function() {
                        window.isPresenterOnline = false;
                        onlineUsers.forEach(function(user) {
                            if (user.role === 'master') window.isPresenterOnline = true;
                        });
                        updateSharingPermission();
                    }, 5000);



                    mqttClient.on('message', function(topic, message) {
                        if (topic === STATUS_TOPIC) {
                            try {
                                var status = JSON.parse(message.toString());

                                // Chat actions
                                if (status.action === 'chat' || status.action === 'file_link' || status.action === 'chat_image') {
                                    if (status.sessionId && status.sessionId !== SESSION_ID) {
                                        var senderName = status.sender || '观众';
                                        var existing = onlineUsers.get(status.sessionId) || {};
                                        onlineUsers.set(status.sessionId, { name: senderName, role: existing.role || 'viewer', time: Date.now() });
                                        updateOnlineStatusUI();
                                    }
                                    if (status.sessionId !== SESSION_ID) {
                                        addMessageToUI(status, false);
                                    }
                                    return;
                                }
                                if (status.action === 'presence') {
                                    if (status.sessionId !== SESSION_ID) {
                                        onlineUsers.set(status.sessionId, { name: status.name, role: status.role, time: Date.now() });
                                        if (status.role === 'master') window.isPresenterOnline = true;
                                        updateOnlineStatusUI();
                                    }
                                    return;
                                }

                                // 投屏权限配置
                                if (status.action === 'config_sharing') {
                                    window.isViewerSharingAllowed = status.allowed;
                                    updateSharingPermission();
                                    return;
                                }
                                if (status.action === 'config_mic') {
                                    window.isViewerMicAllowed = status.allowed;
                                    updateSharingPermission();
                                    return;
                                }
                                if (status.action === 'config_video') {
                                    window.isViewerVideoAllowed = status.allowed;
                                    updateSharingPermission();
                                    return;
                                }

                                if (status.action === 'screen_share_started') {
                                    setManualDisplayPriority(true);
                                    if (window.agoraModule && typeof window.agoraModule.ensureViewerJoined === 'function') {
                                        window.agoraModule.ensureViewerJoined();
                                    }
                                    if (window.agoraModule && typeof window.agoraModule.handleScreenShareLock === 'function') {
                                        window.agoraModule.handleScreenShareLock(status.uid);
                                    }
                                    var stage = document.getElementById('agora-video-stage');
                                    if (stage) stage.style.display = 'flex';

                                    // 【互斥逻辑】正在演示PPT时开启了屏幕分享，自动关闭/隐藏PPT
                                        // 停止并清理当前所有的显示（重置为无文档状态）
                                        closePresentation();
                                    }

                                    // 额外确保隐藏所有显示画布
                                    const pdfCanvas = document.getElementById('pdfCanvas');
                                    if (pdfCanvas) pdfCanvas.style.display = 'none';
                                    const imageDisplay = document.getElementById('imageDisplay');
                                    if (imageDisplay) imageDisplay.style.display = 'none';
                                    const officeIframe = document.getElementById('officeIframe');
                                    if (officeIframe) officeIframe.style.display = 'none';
                                    const videoDisplay = document.getElementById('videoDisplay');
                                    if (videoDisplay) videoDisplay.style.display = 'none';

                                    const ph = document.getElementById('placeholder');
                                    if (ph) {
                                        ph.style.display = 'none'; // 确保 placeholder 隐藏，不遮挡屏幕分享
                                    }
                                    return;
                                }

                                if (status.action === 'screen_share_stopped') {
                                    setManualDisplayPriority(false);
                                    console.log('屏幕共享已结束，请求恢复演示状态...');
                                    if (window.agoraModule && typeof window.agoraModule.exitPresenterPreviewMode === 'function') {
                                        window.agoraModule.exitPresenterPreviewMode();
                                    }
                                    requestStatus(); // 立即拉取主讲当前状态
                                    return;
                                }

                                // === LEAN STATUS FORMAT HANDLER ===
                                // Ultra-light page change: {a:'pg', p:N, t:T}
                                if (status.a === 'pg') {
                                    window._pptLastTs = status.t || Date.now();
                                    setManualDisplayPriority(true); // 活跃翻页，强制切回 PPT
                                    if (status.p !== undefined && (currentPage !== status.p || totalPages !== status.t)) {
                                        currentPage = status.p;
                                        totalPages = status.t;
                                        updatePageInfo();
                                        if (pdfDoc && currentPage > 0) {
                                            renderPage(currentPage);
                                        }
                                    }
                                    return;
                                }

                                // Full status: {p, t, u, s, vs}
                                if (status.t) window._pptLastTs = status.t;

                                if (status.s === 'idle' && !status.u) {
                                    setManualDisplayPriority(false);
                                    closePresentation();
                                    return;
                                }

                                // Handle URL change (new file or initial load)
                                var statusUrl = status.u || status.pdfUrl;
                                var statusPage = status.p !== undefined ? status.p : status.currentPage;
                                var statusTotal = status.t_total !== undefined ? status.t_total : (status.totalPages !== undefined ? status.totalPages : status.t);
                                var statusViewerControl = status.vc !== undefined ? !!status.vc : status.viewerControlEnabled;
                                var statusViewerSharing = status.vs !== undefined ? !!status.vs : status.viewerSharingAllowed;
                                var statusViewerMic = status.vm !== undefined ? !!status.vm : status.viewerMicAllowed;
                                var statusViewerVideo = status.vv !== undefined ? !!status.vv : status.viewerVideoAllowed;

                                if (statusUrl && statusUrl !== currentFilePath) {
                                    // 仅在 PPT 时间戳更新时抢占焦点，防止覆盖正在展示的最新 Push
                                    if (!window._pptLastTs || lastScreenStateTs < window._pptLastTs) {
                                        setManualDisplayPriority(true);
                                    }
                                    currentFilePath = statusUrl;
                                    loadPDF(statusUrl);
                                } else if (status.action === 'refresh') {
                                    setManualDisplayPriority(true);
                                    loadPDF(currentFilePath);
                                }

                                if (statusPage !== undefined && statusTotal !== undefined) {
                                    if (currentPage !== statusPage || totalPages !== statusTotal) {
                                        // 发现内容/页码变化，代表这是活跃状态，抢占优先级
                                        if (status.t) window._pptLastTs = status.t;
                                        setManualDisplayPriority(true);

                                        currentPage = statusPage;
                                        totalPages = statusTotal;
                                        updatePageInfo();
                                        if (pdfDoc && currentPage > 0) {
                                            renderPage(currentPage);
                                        }
                                    }
                                }

                                if (statusViewerControl !== undefined) {
                                    viewerControlEnabled = !!statusViewerControl;
                                    var ctrls = document.querySelector('.controls-container');
                                    if (ctrls) ctrls.style.display = viewerControlEnabled ? 'flex' : 'none';
                                    enableControls(isConnected && viewerControlEnabled);
                                }

                                // Sync viewer sharing permission
                                if (statusViewerSharing !== undefined) {
                                    window.isViewerSharingAllowed = statusViewerSharing;
                                    updateSharingPermission();
                                }
                                if (statusViewerMic !== undefined) {
                                    window.isViewerMicAllowed = statusViewerMic;
                                    updateSharingPermission();
                                }
                                if (statusViewerVideo !== undefined) {
                                    window.isViewerVideoAllowed = statusViewerVideo;
                                    updateSharingPermission();
                                }

                                var videoEl = document.getElementById('videoDisplay');
                                if (videoEl && videoEl.style.display !== 'none') {
                                    handleVideoSync(videoEl, status);
                                }

                                // 主题发布逻辑
                                if (status.action === 'info') {
                                    setManualDisplayPriority(true);
                                    console.log('📥 收到主题信息:', status);
                                    document.getElementById('info-topic').textContent = status.topic;
                                    document.getElementById('info-speaker').textContent = '主讲人: ' + (status.speaker || '未知');
                                    document.getElementById('info-date').textContent = '时间: ' + (status.date || '');
                                    document.getElementById('info-url').textContent = status.url;
                                    var qrContainer = document.getElementById('info-qrcode');
                                    qrContainer.innerHTML = '';
                                    try { new QRCode(qrContainer, { text: status.url, width: 256, height: 256 }); } catch (e) { }
                                    document.getElementById('info-screen').style.display = 'flex';
                                    document.getElementById('pdfCanvas').style.display = 'none';
                                    document.getElementById('imageDisplay').style.display = 'none';
                                    document.getElementById('videoDisplay').style.display = 'none';
                                    document.getElementById('video-prompt').style.display = 'none';
                                    var ph = document.getElementById('placeholder');
                                    if (ph) ph.style.display = 'none';
                                    return;
                                }

                                if (status.action === 'draw_state_sync') { applyDrawStateSync(status); return; }
                                if (status.action === 'draw' || status.action === 'clear' || status.action === 'draw_begin' || status.action === 'draw_chunk' || status.action === 'draw_end' || status.action === 'draw_clear') { handleIncomingDraw(status); return; }
                                if (status.action === 'draw_resync_data') { applyDrawResyncData(status); return; }

                                if (status.action === 'mute_all') {
                                    if (window.agoraModule && typeof window.agoraModule.forceMuteLocal === 'function') window.agoraModule.forceMuteLocal();
                                    return;
                                }
                                if (status.action === 'unmute_all') {
                                    if (window.agoraModule && typeof window.agoraModule.forceUnmuteLocal === 'function') window.agoraModule.forceUnmuteLocal();
                                    return;
                                }

                                if (status.action === 'enable_control') {
                                    var ctrls = document.querySelector('.controls-container');
                                    if (ctrls) ctrls.style.display = status.enabled ? 'flex' : 'none';
                                    viewerControlEnabled = !!status.enabled;
                                    enableControls(isConnected && viewerControlEnabled);
                                    return;
                                }

                            } catch (e) {
                                console.error('解析状态消息失败:', e);
                            }
                        }
                    });

                    mqttClient.on('error', (err) => {
                        console.error('MQTT 错误:', err);
                        updateStatus('连接失败', false);
                    });

                    mqttClient.on('close', () => {
                        isConnected = false;
                        updateStatus('未连接', false);
                        enableControls(false);
                    });

                    mqttClient.on('reconnect', () => {
                        updateStatus('重连中... (3秒)', false);
                    });

                } catch (e) {
                    console.error('连接异常:', e);
                    updateStatus('连接失败', false);
                }
            }

            // 检测是否为图片或视频 URL
            // 检测是否为图片或视频 URL
            function isMediaUrl(url) {
                var imageExtensions = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'];
                var videoExtensions = ['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv'];
                try {
                    var lowerUrl = decodeURIComponent(url).toLowerCase();
                    if (lowerUrl.indexOf('bilibili.com') >= 0 || lowerUrl.indexOf('youtube.com') >= 0) {
                        return { isImage: false, isVideo: true, isMedia: true, isExternal: true };
                    }
                    var urlNoQuery = lowerUrl.split('?')[0];
                    var isImage = imageExtensions.some(function(ext) { return urlNoQuery.indexOf('.' + ext) >= 0; });
                    var isVideo = videoExtensions.some(function(ext) { return urlNoQuery.indexOf('.' + ext) >= 0; });
                    return { isImage: isImage, isVideo: isVideo, isMedia: isImage || isVideo };
                } catch (e) {
                    return { isImage: false, isVideo: false, isMedia: false };
                }
            }

            // 渲染防抖 + 取消机制：防止快速翻页崩溃
            let _viewerRenderRAF = null;
            let _viewerActiveRenderTask = null;
            let _mediaCleared = false; // 只清理一次其他媒体

            function renderPage(pageNum) {
                if (!pdfDoc || pageNum < 1 || pageNum > pdfDoc.numPages) return;

                // 取消之前排队的帧，只保留最新请求
                if (_viewerRenderRAF) {
                    cancelAnimationFrame(_viewerRenderRAF);
                    _viewerRenderRAF = null;
                }

            function renderPage(pageNum) {
                if (!pdfDoc || pageNum < 1 || pageNum > pdfDoc.numPages) return;

                if (_viewerRenderRAF) {
                    cancelAnimationFrame(_viewerRenderRAF);
                    _viewerRenderRAF = null;
                }

                if (_viewerActiveRenderTask) {
                    try { _viewerActiveRenderTask.cancel(); } catch (e) { }
                    _viewerActiveRenderTask = null;
                }

                _viewerRenderRAF = requestAnimationFrame(function() {
                    _viewerRenderRAF = null;
                    _doViewerRenderPage(pageNum);
                });
            }

            function _doViewerRenderPage(pageNum) {
                if (!pdfDoc || pageNum < 1 || pageNum > pdfDoc.numPages) return;

                if (!_mediaCleared) {
                    _mediaCleared = true;
                    var imgDisplay = document.getElementById('imageDisplay');
                    if (imgDisplay) { imgDisplay.style.display = 'none'; imgDisplay.src = ''; }
                    var videoDisplay = document.getElementById('videoDisplay');
                    if (videoDisplay) { videoDisplay.style.display = 'none'; }
                    var videoPrompt = document.getElementById('video-prompt');

                    if (videoIframe) { videoIframe.style.display = 'none'; videoIframe.src = ''; }
                    var placeholder = document.getElementById('placeholder');
                    if (placeholder) placeholder.style.display = 'none';
                }

                var canvas = document.getElementById('pdfCanvas');
                if (canvas) canvas.style.display = 'block';

                pdfDoc.getPage(pageNum).then(function(page) {
                    var ctx = canvas.getContext('2d');
                    var devicePixelRatio = window.devicePixelRatio || 1;
                    var container = document.getElementById('previewScreen');
                    var padding = document.fullscreenElement ? 0 : 40;
                    var containerWidth = container.clientWidth - padding;
                    var containerHeight = container.clientHeight - padding;

                    var viewport = page.getViewport({ scale: 1 });
                    var scaleX = containerWidth / viewport.width;
                    var scaleY = containerHeight / viewport.height;
                    var baseScale = Math.min(scaleX, scaleY);
                    var scale = Math.min(baseScale * devicePixelRatio, 3);
                    var scaledViewport = page.getViewport({ scale: scale });

                    canvas.width = scaledViewport.width;
                    canvas.height = scaledViewport.height;
                    canvas.style.width = (scaledViewport.width / devicePixelRatio) + 'px';
                    canvas.style.height = (scaledViewport.height / devicePixelRatio) + 'px';

                    var renderContext = {
                        canvasContext: ctx,
                        viewport: scaledViewport
                    };

                    _viewerActiveRenderTask = page.render(renderContext);
                    _viewerActiveRenderTask.promise.then(function() {
                        _viewerActiveRenderTask = null;
                        console.log('✓ 页面', pageNum, '渲染完成');
                    }).catch(function(err) {
                        _viewerActiveRenderTask = null;
                    });
                });
            }
