<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EasyShow TV Legacy</title>
    <!-- 引入旧版兼容库 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/mqtt/2.18.8/mqtt.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-cyan: #00f2fe;
            --bg-dark: #0a0e14;
            --card-bg: rgba(20, 28, 40, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #tv-debug-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 400px;
            height: 200px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            font-size: 12px;
            padding: 10px;
            z-index: 10000;
            overflow-y: auto;
            border: 1px solid #333;
            display: none;
            pointer-events: none;
        }

        .preview-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .preview-screen {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pdfCanvas, #imageDisplay, #videoDisplay, #agentScreenLayer {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        #agentScreenLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            display: none;
            background: #000;
            justify-content: center;
            align-items: center;
        }

        #placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .status-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f44336;
            box-shadow: 0 0 10px rgba(244,67,54,0.5);
            z-index: 1000;
        }
        .status-indicator.connected { background: #4caf50; box-shadow: 0 0 10px rgba(76,175,80,0.8); }
        .status-indicator.connecting { background: #ffeb3b; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* 隐藏不必要的UI */
        #discussion-sidebar, #chat-fab, .controls-container, .header { display: none !important; }

        /* 昵称弹窗简易版 */
        #nickname-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .nickname-box { background: #1a1a1a; padding: 40px; border-radius: 20px; text-align: center; }
    </style>
</head>
<body>
    <div id="tv-debug-panel"></div>
    <div class="status-indicator" id="statusDot"></div>
    
    <div class="preview-container">
        <div class="preview-screen" id="previewScreen">
            <canvas id="pdfCanvas" style="display: none;"></canvas>
            <canvas id="drawCanvas" style="position:absolute; top:0; left:0; pointer-events:none; display:none; z-index:10;"></canvas>
            <img id="imageDisplay" style="display: none;" />
            <video id="videoDisplay" style="display: none;" controls autoplay></video>
            <div id="agentScreenLayer"></div>

            <div id="placeholder">
                <h1 id="welcome-title" style="font-size: 40px; color: var(--neon-blue);">SYSTEM INITIALIZING</h1>
                <p style="margin-top: 20px; color: #888;">WAITING FOR SIGNAL...</p>
            </div>
        </div>
    </div>

    <div id="nickname-modal" style="display:none;">
        <div class="nickname-box">
            <h2>电视端正在自动登录...</h2>
        </div>
    </div>

    <script>
        // --- 电视端日志系统 ---
        window.tvLog = function(msg, type) {
            var panel = document.getElementById('tv-debug-panel');
            if (!panel) return;
            var time = new Date().toLocaleTimeString();
            var line = document.createElement('div');
            line.style.color = type === 'error' ? '#f5222d' : (type === 'warn' ? '#faad14' : '#52c41a');
            line.textContent = '[' + time + '] ' + msg;
            panel.appendChild(line);
            panel.scrollTop = panel.scrollHeight;
            console.log(msg);
        };

        // --- 全局配置 (ES5) ---
        var BASE_URL = 'http://easyshow.beundredig.eu.org'; // 强制非加密
        var BEMFA_KEY = '3eb42d69d8b226abe22024d648975f8a';
        var MQTT_URL = 'ws://broker.emqx.io:8083/mqtt'; // 强制非加密端口
        var CONTROL_TOPIC = BEMFA_KEY + '/PPT001';
        var STATUS_TOPIC = BEMFA_KEY + '/PPT002';
        var SESSION_ID = 'tv_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        
        var mqttClient = null;
        var isConnected = false;
        var currentPage = 0;
        var totalPages = 0;
        var pdfDoc = null;
        var currentFilePath = null;
        var lastScreenStateTs = 0;

        // --- Legacy XHR 替代 Fetch ---
        function legacyFetch(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            callback(JSON.parse(xhr.responseText));
                        } catch(e) { callback(null); }
                    } else { callback(null); }
                }
            };
            xhr.send();
        }

        // --- 核心初始化 ---
        window.onload = function() {
            window.tvLog('📺 小米盒子3S 专用版本已启动');
            
            // 调试面板手势：点击左上角 5 次切换显示
            var clicks = 0;
            var lastClick = 0;
            document.addEventListener('click', function(e) {
                if (e.clientX < 150 && e.clientY < 150) {
                    var now = Date.now();
                    if (now - lastClick > 1000) clicks = 0;
                    clicks++;
                    lastClick = now;
                    if (clicks >= 5) {
                        var p = document.getElementById('tv-debug-panel');
                        p.style.display = p.style.display === 'none' ? 'block' : 'none';
                        window.tvLog('调试面板已切换');
                        clicks = 0;
                    }
                }
            });

            // 解析房间号
            var room = '';
            var search = window.location.search;
            if (search) {
                var pairs = search.substring(1).split('&');
                for (var i = 0; i < pairs.length; i++) {
                    var p = pairs[i].split('=');
                    if (p[0] === 'room' || p[0] === 'u') {
                        room = decodeURIComponent(p[1]);
                        break;
                    }
                }
            }
            
            if (room && room !== 'admin') {
                window.tvLog('🏠 目标房间: ' + room);
                var sig = (function(input) {
                    var h = 2166136261;
                    for (var i = 0; i < input.length; i++) {
                        h ^= input.charCodeAt(i);
                        // 使用最稳妥的 imul 实现
                        var a = (h >>> 16) & 0xffff, b = h & 0xffff;
                        var c = (16777619 >>> 16) & 0xffff, d = 16777619 & 0xffff;
                        h = ((b * d) + (((a * d + b * c) << 16) >>> 0)) | 0;
                    }
                    var s = (h >>> 0).toString(16);
                    // 修正：前补0，确保与现代版对齐
                    while(s.length < 8) s = '0' + s;
                    return s;
                })(BEMFA_KEY + ':' + room);
                
                var suffix = '_' + room + '_' + sig;
                CONTROL_TOPIC += suffix;
                STATUS_TOPIC += suffix;
            }

            // 自动跳过登录
            setTimeout(function() {
                var animals = ["电视频道", "客厅盒子", "展示终端"];
                window.sessionUsername = animals[Math.floor(Math.random() * animals.length)] + '_' + SESSION_ID.substring(3, 7);
                window.tvLog('👤 分配名称: ' + window.sessionUsername);
                connectMQTT();
                startPolling();
            }, 1000);
        };

        function connectMQTT() {
            if (typeof mqtt === 'undefined') {
                window.tvLog('❌ MQTT 库未加载', 'error');
                return;
            }

            window.tvLog('🔌 正在连接 MQTT (ws模式)...');
            var dot = document.getElementById('statusDot');
            dot.className = 'status-indicator connecting';

            mqttClient = mqtt.connect(MQTT_URL, {
                clientId: SESSION_ID,
                clean: true,
                keepalive: 60,
                reconnectPeriod: 3000,
                protocolId: 'MQIsdp', // 极重要：老旧设备兼容协议
                protocolVersion: 3
            });

            mqttClient.on('connect', function() {
                window.tvLog('✅ MQTT 连接成功', 'success');
                isConnected = true;
                dot.className = 'status-indicator connected';
                mqttClient.subscribe(STATUS_TOPIC);
            });

            mqttClient.on('message', function(topic, message) {
                if (topic === STATUS_TOPIC) {
                    handleMqttMessage(message.toString());
                }
            });

            mqttClient.on('error', function(err) {
                window.tvLog('❌ MQTT 错误: ' + err, 'error');
                dot.className = 'status-indicator';
            });
            
            mqttClient.on('close', function() {
                isConnected = false;
                dot.className = 'status-indicator';
            });
        }

        function handleMqttMessage(msgStr) {
            try {
                var data = JSON.parse(msgStr);
                
                // 1. 翻页指令 (a: 'pg' 是精简格式)
                if (data.a === 'pg') {
                    if (data.p !== undefined) {
                        currentPage = data.p;
                        totalPages = data.t;
                        if (pdfDoc) renderPage(currentPage);
                    }
                    return;
                }

                // 2. 全量状态同步
                if (data.u || data.pdfUrl) {
                    var url = data.u || data.pdfUrl;
                    if (url !== currentFilePath) {
                        currentFilePath = url;
                        loadFile(url);
                    }
                }
                
                if (data.p !== undefined && data.p !== currentPage) {
                    currentPage = data.p;
                    if (pdfDoc) renderPage(currentPage);
                }

                // 3. 画笔同步 (仅处理清除)
                if (data.action === 'draw_clear' || data.action === 'clear') {
                    clearDrawing();
                }
            } catch(e) {}
        }

        function loadFile(url) {
            if (!url) return;
            url = (url.indexOf('http') === 0) ? url : (BASE_URL + url);
            window.tvLog('📄 加载文件: ' + url.substring(url.lastIndexOf('/') + 1));

            var placeholder = document.getElementById('placeholder');
            placeholder.style.display = 'none';
            
            document.getElementById('pdfCanvas').style.display = 'none';
            document.getElementById('imageDisplay').style.display = 'none';
            document.getElementById('videoDisplay').style.display = 'none';
            document.getElementById('agentScreenLayer').style.display = 'none';

            var ext = url.toLowerCase().split('?')[0].split('.').pop();
            
            if (ext === 'pdf') {
                loadPDF(url);
            } else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].indexOf(ext) >= 0) {
                var img = document.getElementById('imageDisplay');
                img.src = url;
                img.style.display = 'block';
            } else if (['mp4', 'webm'].indexOf(ext) >= 0) {
                var video = document.getElementById('videoDisplay');
                video.src = url;
                video.style.display = 'block';
            }
        }

        function loadPDF(url) {
            pdfjsLib.getDocument(url).promise.then(function(doc) {
                pdfDoc = doc;
                totalPages = doc.numPages;
                currentPage = 1;
                document.getElementById('pdfCanvas').style.display = 'block';
                renderPage(1);
            }).catch(function(err) {
                window.tvLog('❌ PDF 加载失败: ' + err.message, 'error');
            });
        }

        function renderPage(pageNum) {
            if (!pdfDoc) return;
            pdfDoc.getPage(pageNum).then(function(page) {
                var canvas = document.getElementById('pdfCanvas');
                var ctx = canvas.getContext('2d');
                var viewport = page.getViewport({ scale: 1.5 });
                
                // 自动适应屏幕高度
                var scale = window.innerHeight / viewport.height;
                var scaledViewport = page.getViewport({ scale: scale });

                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;

                page.render({
                    canvasContext: ctx,
                    viewport: scaledViewport
                });
            });
        }

        function clearDrawing() {
            var canvas = document.getElementById('drawCanvas');
            if (canvas) {
                var ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        // --- Agent 轮询系统 (弥补 MQTT 丢包) ---
        function startPolling() {
            setInterval(function() {
                var url = BASE_URL + '/api/screen/state?roomId=' + encodeURIComponent(STATUS_TOPIC);
                legacyFetch(url, function(data) {
                    if (data && data.state) {
                        var state = data.state;
                        var ts = Number(state.ts || 0);
                        if (ts > lastScreenStateTs) {
                            lastScreenStateTs = ts;
                            renderAgentPush(state);
                        }
                    }
                });
            }, 2000);
        }

        function renderAgentPush(state) {
            var layer = document.getElementById('agentScreenLayer');
            var content = state.url || state.content;
            if (!content) {
                layer.style.display = 'none';
                return;
            }

            window.tvLog('🤖 Agent 推送更新');
            layer.innerHTML = '';
            layer.style.display = 'flex';
            
            var type = state.type || 'text';
            if (type === 'image') {
                layer.innerHTML = '<img src="' + content + '" style="max-width:100%; max-height:100%;">';
            } else if (type === 'text') {
                layer.innerHTML = '<div style="font-size:30px; padding:40px; color:white;">' + content + '</div>';
            } else if (type === 'video') {
                layer.innerHTML = '<video src="' + content + '" controls autoplay style="width:100%; height:100%;"></video>';
            }
        }
    </script>
</body>
</html>
