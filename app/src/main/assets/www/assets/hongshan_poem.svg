<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    
    <!-- 湖水渐变 -->
    <linearGradient id="lakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81d4fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 文字阴影 -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#00000022"/>
    </filter>

    <!-- 柔和发光 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景底色 -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <!-- 远山轮廓 -->
  <path d="M 0 400 Q 300 350 600 400 T 1200 400 L 1200 800 L 0 800 Z" fill="#e0f2f1" opacity="0.5"/>

  <!-- 南湖水面 -->
  <rect x="0" y="550" width="1200" height="250" fill="url(#lakeGrad)"/>
  <!-- 水面波纹 -->
  <g opacity="0.4" stroke="#ffffff" stroke-width="1.5">
    <path d="M 200 620 Q 300 610 400 620 T 600 620" fill="none">
      <animate attributeName="d" values="M 200 620 Q 300 610 400 620 T 600 620; M 200 625 Q 300 615 400 625 T 600 625; M 200 620 Q 300 610 400 620 T 600 620" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 700 680 Q 850 670 1000 680" fill="none">
      <animate attributeName="d" values="M 700 680 Q 850 670 1000 680; M 700 685 Q 850 675 1000 685; M 700 680 Q 850 670 1000 680" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 垂柳 -->
  <g transform="translate(100, 0)">
    <path d="M 0 0 L 0 150" stroke="#5d4037" stroke-width="8" fill="none"/>
    <g stroke="#81c784" stroke-width="2" fill="none">
      <path d="M 0 150 Q -50 300 -20 500">
        <animateTransform attributeName="transform" type="rotate" values="-2,0,150; 2,0,150; -2,0,150" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 150 Q 50 350 20 550">
        <animateTransform attributeName="transform" type="rotate" values="3,0,150; -3,0,150; 3,0,150" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 150 Q -20 350 -10 450">
        <animateTransform attributeName="transform" type="rotate" values="-1,0,150; 1,0,150; -1,0,150" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 装饰框 -->
  <rect x="300" y="100" width="600" height="450" rx="20" fill="#ffffff" fill-opacity="0.9" stroke="#cfd8dc" stroke-width="2" filter="url(#textShadow)"/>
  <rect x="320" y="120" width="560" height="410" rx="10" fill="none" stroke="#f5f5f5" stroke-width="1"/>

  <!-- 标题 -->
  <text x="600" y="180" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="42" font-weight="bold" fill="#2c3e50" filter="url(#textShadow)">
    南 湖 书 声
  </text>
  <text x="600" y="225" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="20" fill="#7f8c8d" letter-spacing="2">
    —— 寄武汉洪山外国语小学
  </text>

  <!-- 诗句 -->
  <g font-family="'STKaiti', 'KaiTi', serif" font-size="48" fill="#34495e" text-anchor="middle">
    <text x="600" y="320">南湖北岸柳丝长，</text>
    <text x="600" y="390">外语声中翰墨香。</text>
    <text x="600" y="460">博学寰球开眼界，</text>
    <text x="600" y="530">人文铸魂少年强。</text>
  </g>

  <!-- 装饰图标：地球仪 & 笔墨 -->
  <g transform="translate(350, 480) scale(0.6)" opacity="0.8">
    <!-- 简易地球仪 -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#2196f3" stroke-width="3"/>
    <path d="M -40 0 L 40 0 M 0 -40 L 0 40" stroke="#2196f3" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="none" stroke="#2196f3" stroke-width="2"/>
  </g>
  
  <g transform="translate(850, 480) scale(0.6)" opacity="0.8">
    <!-- 简易毛笔 -->
    <path d="M 0 -50 L 0 20" stroke="#5d4037" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0 20 Q 5 40 0 50 Q -5 40 0 20" fill="#333"/>
  </g>

  <!-- 底部装饰 -->
  <text x="600" y="750" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="16" fill="#ffffff" opacity="0.9" letter-spacing="3">
    外语特色立校 · 人文精神铸魂
  </text>

  <!-- 飘落的柳叶 -->
  <g>
    <path d="M 0 0 Q 5 10 0 20 Q -5 10 0 0" fill="#81c784">
      <animateTransform attributeName="transform" type="translate" values="200,200; 400,600; 300,850" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="8s" additive="sum" repeatCount="indefinite"/>
    </path>
    <path d="M 0 0 Q 5 10 0 20 Q -5 10 0 0" fill="#aed581">
      <animateTransform attributeName="transform" type="translate" values="900,100; 700,500; 800,850" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0; -360" dur="10s" additive="sum" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
