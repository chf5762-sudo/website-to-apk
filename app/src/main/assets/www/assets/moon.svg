<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 深空背景渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#000510"/>
    </radialGradient>

    <!-- 月亮表面渐变 -->
    <radialGradient id="moonGrad" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f0e8c8"/>
      <stop offset="40%" stop-color="#d4c890"/>
      <stop offset="100%" stop-color="#8a7a50"/>
    </radialGradient>

    <!-- 月亮光晕 -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffe080" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffe080" stop-opacity="0"/>
    </radialGradient>

    <!-- 环形阴影（新月感） -->
    <radialGradient id="shadowGrad" cx="68%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#000510" stop-opacity="0.0"/>
      <stop offset="55%" stop-color="#000510" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000510" stop-opacity="0.92"/>
    </radialGradient>

    <!-- 陨石坑凹陷效果 -->
    <radialGradient id="craterA" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7a6840" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c8b878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="craterB" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6a5830" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c0b070" stop-opacity="0"/>
    </radialGradient>

    <!-- 星星闪烁滤镜 -->
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 月亮柔光滤镜 -->
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 剪切月亮圆形 -->
    <clipPath id="moonClip">
      <circle cx="380" cy="300" r="155"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- 星星群（层1 小且暗） -->
  <g opacity="0.6" filter="url(#starGlow)">
    <circle cx="45" cy="30" r="0.8" fill="#fff"/>
    <circle cx="120" cy="85" r="1" fill="#fff"/>
    <circle cx="200" cy="20" r="0.7" fill="#e0e8ff"/>
    <circle cx="310" cy="55" r="0.9" fill="#fff"/>
    <circle cx="480" cy="25" r="1.1" fill="#fff"/>
    <circle cx="560" cy="70" r="0.8" fill="#e0e8ff"/>
    <circle cx="650" cy="40" r="0.7" fill="#fff"/>
    <circle cx="720" cy="90" r="1" fill="#fff"/>
    <circle cx="755" cy="30" r="0.8" fill="#e0e8ff"/>
    <circle cx="90" cy="160" r="0.7" fill="#fff"/>
    <circle cx="160" cy="130" r="1" fill="#fff"/>
    <circle cx="250" cy="170" r="0.8" fill="#e0e8ff"/>
    <circle cx="620" cy="130" r="0.9" fill="#fff"/>
    <circle cx="700" cy="160" r="0.8" fill="#fff"/>
    <circle cx="780" cy="140" r="0.7" fill="#e0e8ff"/>
    <circle cx="50" cy="420" r="0.8" fill="#fff"/>
    <circle cx="100" cy="500" r="1" fill="#e0e8ff"/>
    <circle cx="170" cy="470" r="0.7" fill="#fff"/>
    <circle cx="660" cy="440" r="0.9" fill="#fff"/>
    <circle cx="710" cy="510" r="0.8" fill="#fff"/>
    <circle cx="760" cy="480" r="1" fill="#e0e8ff"/>
    <circle cx="30" cy="550" r="0.7" fill="#fff"/>
    <circle cx="790" cy="560" r="0.8" fill="#fff"/>
    <circle cx="580" cy="560" r="0.9" fill="#e0e8ff"/>
    <circle cx="220" cy="540" r="0.7" fill="#fff"/>
  </g>

  <!-- 星星群（层2 中等亮） -->
  <g opacity="0.85">
    <circle cx="70" cy="55" r="1.3" fill="#ffffff" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.85;0.3;0.85" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="100" r="1.5" fill="#ffe8a0" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="50" r="1.4" fill="#ffffff" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="110" r="1.6" fill="#c8d8ff" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.8;0.25;0.8" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="490" r="1.4" fill="#ffffff" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.85;0.3;0.85" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="470" r="1.5" fill="#ffe8a0" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 月亮光晕大圈 -->
  <circle cx="380" cy="300" r="220" fill="url(#glowGrad)">
    <animate attributeName="r" values="215;225;215" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 月亮主体 -->
  <circle cx="380" cy="300" r="155" fill="url(#moonGrad)" filter="url(#moonGlow)"/>

  <!-- 月球表面纹理（陨石坑） -->
  <g clip-path="url(#moonClip)">
    <!-- 大陨石坑 1 -->
    <circle cx="330" cy="260" r="38" fill="url(#craterA)"/>
    <circle cx="330" cy="260" r="38" fill="none" stroke="#b0a060" stroke-width="1.5" opacity="0.4"/>
    <circle cx="322" cy="253" r="8" fill="#c8b870" opacity="0.5"/>

    <!-- 大陨石坑 2 -->
    <circle cx="430" cy="340" r="28" fill="url(#craterB)"/>
    <circle cx="430" cy="340" r="28" fill="none" stroke="#a09050" stroke-width="1.2" opacity="0.35"/>

    <!-- 中陨石坑 -->
    <circle cx="360" cy="360" r="18" fill="url(#craterA)"/>
    <circle cx="360" cy="360" r="18" fill="none" stroke="#b0a060" stroke-width="1" opacity="0.3"/>

    <!-- 小陨石坑群 -->
    <circle cx="415" cy="260" r="11" fill="url(#craterB)" opacity="0.8"/>
    <circle cx="295" cy="340" r="9" fill="url(#craterA)" opacity="0.7"/>
    <circle cx="460" cy="290" r="7" fill="url(#craterB)" opacity="0.65"/>
    <circle cx="355" cy="220" r="6" fill="url(#craterA)" opacity="0.6"/>
    <circle cx="390" cy="395" r="8" fill="url(#craterB)" opacity="0.7"/>
    <circle cx="305" cy="300" r="5" fill="url(#craterA)" opacity="0.55"/>
    <circle cx="445" cy="370" r="5" fill="url(#craterA)" opacity="0.5"/>

    <!-- 月球表面高光纹 -->
    <ellipse cx="340" cy="240" rx="80" ry="35" fill="none" stroke="#fff8e0" stroke-width="1" opacity="0.12" transform="rotate(-25,340,240)"/>
    <ellipse cx="400" cy="330" rx="60" ry="25" fill="none" stroke="#fff8e0" stroke-width="0.8" opacity="0.09" transform="rotate(15,400,330)"/>
  </g>

  <!-- 新月阴影遮罩 -->
  <circle cx="380" cy="300" r="155" fill="url(#shadowGrad)" clip-path="url(#moonClip)"/>

  <!-- 月亮边缘反光 -->
  <circle cx="380" cy="300" r="155" fill="none" stroke="#fff8e0" stroke-width="1.5" opacity="0.18"/>

  <!-- 流星 -->
  <g>
    <line x1="650" y1="80" x2="700" y2="55" stroke="white" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.6s" begin="2s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="430" x2="185" y2="410" stroke="white" stroke-width="1.2" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="0.5s" begin="5.5s" repeatCount="indefinite"/>
    </line>
    <line x1="700" y1="500" x2="740" y2="480" stroke="#ffe8a0" stroke-width="1.3" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="0.55s" begin="9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 底部文字 -->
  <text x="400" y="498" text-anchor="middle" font-family="'Georgia', serif" font-size="14" fill="#d0c890" opacity="0.55" letter-spacing="4">
    ☽  LUNA  ☾
  </text>
</svg>
