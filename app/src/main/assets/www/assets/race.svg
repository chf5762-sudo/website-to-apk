<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="60%" stop-color="#b0e0ff"/>
      <stop offset="100%" stop-color="#d4f0a0"/>
    </linearGradient>
    <!-- 草地渐变 -->
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cb85c"/>
      <stop offset="100%" stop-color="#3a8a3a"/>
    </linearGradient>
    <!-- 跑道渐变 -->
    <linearGradient id="trackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d5a0"/>
      <stop offset="100%" stop-color="#c8b070"/>
    </linearGradient>
    <!-- 云朵滤镜 -->
    <filter id="cloudBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000033"/>
    </filter>
    <!-- 兔子跑步路径 -->
    <path id="rabbitPath" d="M -80,0 L 960,0"/>
    <!-- 乌龟路径 -->
    <path id="tortoisePathLine" d="M -80,0 L 960,0"/>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="900" height="520" fill="url(#skyGrad)"/>

  <!-- 太阳 -->
  <circle cx="820" cy="70" r="42" fill="#ffe04a" opacity="0.95"/>
  <circle cx="820" cy="70" r="52" fill="#ffe04a" opacity="0.18"/>
  <circle cx="820" cy="70" r="65" fill="#ffe04a" opacity="0.08"/>
  <!-- 太阳光线 -->
  <g stroke="#ffe04a" stroke-width="2.5" opacity="0.5">
    <line x1="820" y1="10" x2="820" y2="0"/>
    <line x1="858" y1="32" x2="868" y2="22"/>
    <line x1="876" y1="70" x2="888" y2="70"/>
    <line x1="858" y1="108" x2="868" y2="118"/>
    <line x1="820" y1="126" x2="820" y2="138"/>
    <line x1="782" y1="108" x2="772" y2="118"/>
    <line x1="764" y1="70" x2="752" y2="70"/>
    <line x1="782" y1="32" x2="772" y2="22"/>
  </g>

  <!-- 云朵 1 -->
  <g opacity="0.9">
    <ellipse cx="150" cy="75" rx="55" ry="28" fill="white"/>
    <ellipse cx="185" cy="62" rx="38" ry="25" fill="white"/>
    <ellipse cx="118" cy="68" rx="30" ry="20" fill="white"/>
    <animate attributeName="transform" type="translate" values="0,0;12,0;0,0" dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- 云朵 2 -->
  <g opacity="0.8">
    <ellipse cx="520" cy="55" rx="60" ry="26" fill="white"/>
    <ellipse cx="558" cy="44" rx="40" ry="22" fill="white"/>
    <ellipse cx="488" cy="50" rx="32" ry="19" fill="white"/>
    <animate attributeName="transform" type="translate" values="0,0;-15,0;0,0" dur="22s" repeatCount="indefinite"/>
  </g>

  <!-- 远山 -->
  <ellipse cx="200" cy="290" rx="180" ry="90" fill="#8fc87a" opacity="0.4"/>
  <ellipse cx="500" cy="310" rx="220" ry="100" fill="#7ab868" opacity="0.35"/>
  <ellipse cx="780" cy="295" rx="160" ry="80" fill="#90cc80" opacity="0.38"/>

  <!-- 草地 -->
  <rect x="0" y="350" width="900" height="170" fill="url(#grassGrad)"/>

  <!-- 跑道 -->
  <rect x="0" y="360" width="900" height="80" fill="url(#trackGrad)" rx="0"/>
  <!-- 跑道线条 -->
  <line x1="0" y1="362" x2="900" y2="362" stroke="#d4b060" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="438" x2="900" y2="438" stroke="#c4a050" stroke-width="2" opacity="0.6"/>
  <!-- 虚线中线 -->
  <line x1="0" y1="400" x2="900" y2="400" stroke="white" stroke-width="2" stroke-dasharray="24,16" opacity="0.45"/>

  <!-- 起跑线 -->
  <rect x="55" y="355" width="5" height="90" fill="white" opacity="0.8"/>
  <text x="58" y="352" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="bold">START</text>

  <!-- 终点线（旗帜） -->
  <rect x="840" y="355" width="5" height="90" fill="white" opacity="0.9"/>
  <!-- 旗帜方格 -->
  <g transform="translate(845,355)">
    <rect x="0" y="0" width="8" height="7" fill="black"/>
    <rect x="8" y="0" width="8" height="7" fill="white"/>
    <rect x="16" y="0" width="8" height="7" fill="black"/>
    <rect x="0" y="7" width="8" height="7" fill="white"/>
    <rect x="8" y="7" width="8" height="7" fill="black"/>
    <rect x="16" y="7" width="8" height="7" fill="white"/>
    <rect x="0" y="14" width="8" height="7" fill="black"/>
    <rect x="8" y="14" width="8" height="7" fill="white"/>
    <rect x="16" y="14" width="8" height="7" fill="black"/>
    <rect x="0" y="21" width="8" height="7" fill="white"/>
    <rect x="8" y="21" width="8" height="7" fill="black"/>
    <rect x="16" y="21" width="8" height="7" fill="white"/>
  </g>
  <text x="852" y="352" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="bold">FINISH</text>

  <!-- 草地装饰花草 -->
  <g fill="#2a6a2a" opacity="0.6">
    <rect x="80" y="440" width="3" height="14" rx="1"/>
    <rect x="200" y="445" width="3" height="12" rx="1"/>
    <rect x="350" y="442" width="3" height="13" rx="1"/>
    <rect x="480" y="446" width="3" height="11" rx="1"/>
    <rect x="600" y="443" width="3" height="14" rx="1"/>
    <rect x="730" y="447" width="3" height="10" rx="1"/>
    <rect x="810" y="444" width="3" height="12" rx="1"/>
  </g>
  <!-- 小花 -->
  <g>
    <circle cx="120" cy="450" r="4" fill="#ff6eb4" opacity="0.7"/>
    <circle cx="270" cy="452" r="3.5" fill="#ffcc00" opacity="0.75"/>
    <circle cx="420" cy="449" r="4" fill="#ff9966" opacity="0.7"/>
    <circle cx="570" cy="451" r="3" fill="#cc88ff" opacity="0.7"/>
    <circle cx="720" cy="450" r="4" fill="#66ddff" opacity="0.7"/>
  </g>

  <!-- ===== 树（大） ===== -->
  <!-- 树1 起跑线旁 -->
  <rect x="25" y="290" width="10" height="75" fill="#8B5E3C"/>
  <circle cx="30" cy="265" r="38" fill="#3a8a3a"/>
  <circle cx="15" cy="280" r="26" fill="#4a9a4a"/>
  <circle cx="48" cy="278" r="24" fill="#4a9a4a"/>
  <!-- 树2 中段 -->
  <rect x="448" y="298" width="9" height="68" fill="#8B5E3C"/>
  <circle cx="452" cy="272" r="34" fill="#3a9a3a"/>
  <circle cx="436" cy="285" r="24" fill="#4aaa4a"/>
  <circle cx="468" cy="285" r="22" fill="#4aaa4a"/>
  <!-- 树3 终点旁 -->
  <rect x="870" y="288" width="10" height="78" fill="#8B5E3C"/>
  <circle cx="875" cy="262" r="40" fill="#3a8a3a"/>
  <circle cx="858" cy="277" r="28" fill="#4a9a4a"/>
  <circle cx="893" cy="275" r="26" fill="#4a9a4a"/>

  <!-- 观众台（小旗帜） -->
  <text x="200" y="345" font-size="18" opacity="0.8">🚩</text>
  <text x="650" y="342" font-size="18" opacity="0.8">🚩</text>

  <!-- ===== 兔子 (快速跑，到中途睡觉) ===== -->
  <g id="rabbitGroup" filter="url(#shadow)">
    <!-- 兔子整体前进 (0-12s飞快，12-26s睡觉停着，26-40s慢慢跑) -->
    <animateTransform attributeName="transform" type="translate"
      values="60,378; 530,378; 530,378; 780,378"
      keyTimes="0; 0.28; 0.65; 1"
      dur="14s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.6 1; 0 0 1 1; 0.2 0 0.8 1"/>

    <!-- 兔子身体 -->
    <ellipse cx="0" cy="20" rx="22" ry="15" fill="#f5f0e8"/>
    <!-- 肚子 -->
    <ellipse cx="0" cy="24" rx="14" ry="10" fill="#faf7f0"/>
    <!-- 头 -->
    <circle cx="20" cy="8" r="14" fill="#f5f0e8"/>
    <!-- 眼睛（跑步时睁开，睡觉时闭合） -->
    <circle cx="26" cy="5" r="3" fill="#333">
      <animate attributeName="r" values="3;3;0;3" keyTimes="0;0.27;0.28;1" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="26" cy="5" r="1.5" fill="white">
      <animate attributeName="r" values="1.5;1.5;0;1.5" keyTimes="0;0.27;0.28;1" dur="14s" repeatCount="indefinite"/>
    </circle>
    <!-- 睡眠眼（Z闭眼线） -->
    <line x1="23" y1="5" x2="29" y2="5" stroke="#888" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.27;0.64;0.65" dur="14s" repeatCount="indefinite"/>
    </line>
    <!-- 鼻子 -->
    <circle cx="32" cy="9" r="2.5" fill="#ff9999"/>
    <!-- 嘴 -->
    <path d="M30,11 Q32,14 34,11" fill="none" stroke="#999" stroke-width="1.2"/>
    <!-- 耳朵 -->
    <ellipse cx="16" cy="-8" rx="5" ry="14" fill="#f5f0e8" transform="rotate(-15,16,-8)"/>
    <ellipse cx="16" cy="-8" rx="2.5" ry="10" fill="#ffb0b0" transform="rotate(-15,16,-8)"/>
    <ellipse cx="24" cy="-10" rx="4.5" ry="13" fill="#f5f0e8" transform="rotate(10,24,-10)"/>
    <ellipse cx="24" cy="-10" rx="2" ry="9" fill="#ffb0b0" transform="rotate(10,24,-10)"/>
    <!-- 尾巴 -->
    <circle cx="-22" cy="18" r="7" fill="white"/>
    <!-- 前腿 -->
    <ellipse cx="18" cy="33" rx="5" ry="9" fill="#f0ece0">
      <animateTransform attributeName="transform" type="rotate"
        values="-20,18,24; 20,18,24; -20,18,24"
        dur="0.35s" repeatCount="indefinite">
        <animate attributeName="dur" values="0.35s;0.35s;9999s;0.35s" keyTimes="0;0.27;0.28;0.65" dur="14s" repeatCount="indefinite"/>
      </animateTransform>
    </ellipse>
    <ellipse cx="8" cy="35" rx="5" ry="9" fill="#f0ece0">
      <animateTransform attributeName="transform" type="rotate"
        values="20,8,24; -20,8,24; 20,8,24"
        dur="0.35s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 后腿 -->
    <ellipse cx="-10" cy="33" rx="6" ry="10" fill="#f0ece0">
      <animateTransform attributeName="transform" type="rotate"
        values="25,-10,24; -25,-10,24; 25,-10,24"
        dur="0.35s" repeatCount="indefinite"/>
    </ellipse>
    <!-- ZZZ 睡觉泡泡 -->
    <g>
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.27;0.64;0.65" dur="14s" repeatCount="indefinite"/>
      <text x="30" y="-12" font-family="Arial" font-size="11" fill="#aaaaff" font-weight="bold">Z</text>
      <text x="40" y="-22" font-family="Arial" font-size="9" fill="#aaaaff" font-weight="bold">z</text>
      <text x="48" y="-30" font-family="Arial" font-size="7" fill="#aaaaff" font-weight="bold">z</text>
    </g>
    <!-- 标签 -->
    <text x="-12" y="-22" font-family="Arial,sans-serif" font-size="11" fill="#cc4400" font-weight="bold">🐰 兔</text>
  </g>

  <!-- ===== 乌龟 (匀速慢跑到终点) ===== -->
  <g id="tortoiseGroup" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate"
      values="60,400; 870,400"
      keyTimes="0; 1"
      dur="14s" repeatCount="indefinite"
      calcMode="linear"/>

    <!-- 龟壳 -->
    <ellipse cx="0" cy="10" rx="26" ry="18" fill="#5a8a3a"/>
    <!-- 龟壳花纹 -->
    <ellipse cx="0" cy="10" rx="20" ry="13" fill="#6a9a4a"/>
    <line x1="-10" y1="5" x2="10" y2="18" stroke="#4a7a2a" stroke-width="1.5" opacity="0.6"/>
    <line x1="10" y1="5" x2="-10" y2="18" stroke="#4a7a2a" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="22" stroke="#4a7a2a" stroke-width="1.5" opacity="0.6"/>
    <line x1="-24" y1="10" x2="24" y2="10" stroke="#4a7a2a" stroke-width="1.5" opacity="0.6"/>
    <!-- 龟头 -->
    <ellipse cx="28" cy="8" rx="11" ry="8" fill="#7ab04a"/>
    <!-- 眼睛 -->
    <circle cx="33" cy="5" r="2.5" fill="#333"/>
    <circle cx="33" cy="5" r="1" fill="white"/>
    <!-- 嘴 -->
    <path d="M36,10 Q38,12 40,10" fill="none" stroke="#5a8a3a" stroke-width="1.2"/>
    <!-- 鼻子 -->
    <circle cx="38" cy="9" r="1.5" fill="#5a8a3a"/>
    <!-- 尾巴 -->
    <ellipse cx="-26" cy="12" rx="6" ry="4" fill="#7ab04a"/>
    <!-- 四条腿 -->
    <ellipse cx="15" cy="25" rx="5" ry="8" fill="#7ab04a">
      <animateTransform attributeName="transform" type="rotate"
        values="-15,15,18; 15,15,18; -15,15,18" dur="0.7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-5" cy="26" rx="5" ry="8" fill="#7ab04a">
      <animateTransform attributeName="transform" type="rotate"
        values="15,-5,18; -15,-5,18; 15,-5,18" dur="0.7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-15" cy="25" rx="5" ry="8" fill="#7ab04a">
      <animateTransform attributeName="transform" type="rotate"
        values="-15,-15,18; 15,-15,18; -15,-15,18" dur="0.7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="5" cy="26" rx="5" ry="7" fill="#7ab04a">
      <animateTransform attributeName="transform" type="rotate"
        values="15,5,18; -15,5,18; 15,5,18" dur="0.7s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 标签 -->
    <text x="-18" y="-10" font-family="Arial,sans-serif" font-size="11" fill="#224a00" font-weight="bold">🐢 龟</text>
  </g>

  <!-- ===== 标题 ===== -->
  <rect x="280" y="14" width="340" height="52" rx="26" fill="#fff" opacity="0.82"/>
  <text x="450" y="32" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#888">经典寓言故事</text>
  <text x="450" y="57" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="26" fill="#d04800" font-weight="bold" letter-spacing="4">龟 兔 赛 跑</text>

  <!-- ===== 观众席小人 ===== -->
  <!-- 观众1 -->
  <g transform="translate(148,328)">
    <circle cx="0" cy="0" r="8" fill="#ffcc99"/>
    <rect x="-6" y="8" width="12" height="16" rx="3" fill="#e74c3c"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" dy="4">👏</text>
  </g>
  <!-- 观众2 -->
  <g transform="translate(300,330)">
    <circle cx="0" cy="0" r="8" fill="#ffe0b0"/>
    <rect x="-6" y="8" width="12" height="16" rx="3" fill="#3498db"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" dy="4">🎉</text>
  </g>
  <!-- 观众3 -->
  <g transform="translate(600,329)">
    <circle cx="0" cy="0" r="8" fill="#ffcc99"/>
    <rect x="-6" y="8" width="12" height="16" rx="3" fill="#27ae60"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" dy="4">📣</text>
  </g>
  <!-- 观众4 -->
  <g transform="translate(720,328)">
    <circle cx="0" cy="0" r="8" fill="#ffe0cc"/>
    <rect x="-6" y="8" width="12" height="16" rx="3" fill="#9b59b6"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" dy="4">🏆</text>
  </g>

  <!-- ===== 底部寓意 ===== -->
  <rect x="0" y="476" width="900" height="44" fill="#1a1a2e" opacity="0.82"/>
  <text x="450" y="502" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#f0d080" letter-spacing="2">
    🐢 坚持不懈，终究抵达终点；骄傲自满，必将落后。🐰
  </text>
</svg>
