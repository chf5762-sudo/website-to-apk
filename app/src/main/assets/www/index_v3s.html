<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>EasyShow TV Legacy</title>
    <!-- 本地化核心库，解决老旧电视 CDN 加载失败问题 -->
    <script src="scripts/mqtt.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-cyan: #00f2fe;
            --bg-dark: #0a0e14;
            --card-bg: rgba(20, 28, 40, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #tv-debug-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 450px;
            height: 250px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            font-size: 14px;
            padding: 10px;
            z-index: 10000;
            overflow-y: auto;
            border: 1px solid #0f0;
            display: none;
            pointer-events: none;
        }

        .status-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f44336;
            box-shadow: 0 0 10px rgba(244,67,54,0.5);
            z-index: 1000;
        }
        .status-indicator.green { background: #4caf50; box-shadow: 0 0 10px rgba(76,175,80,0.8); }
        .status-indicator.yellow { background: #ffeb3b; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .preview-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #pdfCanvas, #imageDisplay, #videoDisplay, #agentScreenLayer {
            max-width: 100%;
            max-height: 100%;
        }

        #agentScreenLayer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; display: none; background: #000;
            justify-content: center; align-items: center;
        }

        #placeholder { text-align: center; }
    </style>
</head>
<body>
    <div id="tv-debug-panel"></div>
    <div class="status-indicator" id="mqtt-dot"></div>
    
    <div class="preview-container">
        <div id="placeholder">
            <h1 style="font-size: 40px; color: var(--neon-blue);">SYSTEM INITIALIZING</h1>
            <p style="margin-top: 20px; color: #888;">WAITING FOR SIGNAL...</p>
        </div>
        <canvas id="pdfCanvas" style="display: none;"></canvas>
        <img id="imageDisplay" style="display: none;" />
        <video id="videoDisplay" style="display: none;" controls autoplay crossorigin="anonymous" playsinline oncontextmenu="return false;" onerror="window.tvLog('🎬 Video Error: ' + (this.error ? this.error.code : 'unknown'), 'error')"></video>
        <div id="agentScreenLayer"></div>
    </div>

    <script>
        // --- 日志增强 ---
        window.tvLog = function(msg, type) {
            var panel = document.getElementById('tv-debug-panel');
            if (!panel) return;
            var line = document.createElement('div');
            line.style.color = type === 'error' ? '#ff4d4f' : (type === 'warn' ? '#faad14' : '#52c41a');
            line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            panel.appendChild(line);
            panel.scrollTop = panel.scrollHeight;
            console.log(msg);
        };

        // --- 配置 ---
        var BASE_URL = 'http://easyshow.beundredig.eu.org';
        var BEMFA_KEY = '3eb42d69d8b226abe22024d648975f8a';
        var MQTT_URL = 'ws://broker.emqx.io:8083/mqtt';
        var CONTROL_TOPIC = BEMFA_KEY + '/PPT001';
        var STATUS_TOPIC = BEMFA_KEY + '/PPT002';
        var SESSION_ID = 'TV_' + Math.random().toString(16).substr(2, 6);
        
        var mqttClient = null;
        var lastScreenStateTs = 0;

        window.onload = function() {
            window.tvLog('📺 XiaoMi Box 3S V3_Static Start');
            
            // 调试面板激活：5次点击左上角
            var clicks = 0;
            document.addEventListener('click', function(e) {
                if (e.clientX < 150 && e.clientY < 150) {
                    if (++clicks >= 5) {
                        var p = document.getElementById('tv-debug-panel');
                        p.style.display = p.style.display === 'none' ? 'block' : 'none';
                        clicks = 0;
                    }
                }
            });

            // 获取房间号
            var room = (new RegExp('[?&]room=([^&]+)').exec(location.search) || [])[1];
            if (room) {
                window.tvLog('🏠 Room: ' + room);
                var sig = (function(input) {
                    var h = 2166136261;
                    for (var i = 0; i < input.length; i++) {
                        h ^= input.charCodeAt(i);
                        var a = (h >>> 16) & 0xffff, b = h & 0xffff;
                        var c = (16777619 >>> 16) & 0xffff, d = 16777619 & 0xffff;
                        h = ((b * d) + (((a * d + b * c) << 16) >>> 0)) | 0;
                    }
                    var s = (h >>> 0).toString(16);
                    while(s.length < 8) s = '0' + s;
                    return s;
                })(BEMFA_KEY + ':' + room);
                
                var suffix = '_' + room + '_' + sig;
                CONTROL_TOPIC += suffix;
                STATUS_TOPIC += suffix;
                window.tvLog('📡 Full Topic: ' + CONTROL_TOPIC);
            }

            connectMQTT();
            startPolling();
        };

        function connectMQTT() {
            window.tvLog('🔌 Connecting to MQTT: ' + MQTT_URL);
            var dot = document.getElementById('mqtt-dot');
            dot.className = 'status-indicator yellow';

            if (typeof mqtt === 'undefined') {
                window.tvLog('❌ CRITICAL: MQTT Library NOT FOUND!', 'error');
                dot.className = 'status-indicator';
                return;
            }

            try {
                mqttClient = mqtt.connect(MQTT_URL, {
                    clientId: SESSION_ID,
                    clean: true,
                    keepalive: 60,
                    reconnectPeriod: 5000,
                    protocolId: 'MQIsdp',
                    protocolVersion: 3,
                    connectTimeout: 30000
                });

                mqttClient.on('connect', function() {
                    window.tvLog('✅ Connected to Broker', 'success');
                    dot.className = 'status-indicator green';
                    mqttClient.subscribe(CONTROL_TOPIC);
                    mqttClient.subscribe(STATUS_TOPIC);
                    window.tvLog('📡 Subscribed topics');
                });

                mqttClient.on('message', function(topic, msg) {
                    handleMqttMessage(msg.toString());
                });

                mqttClient.on('error', function(err) {
                    window.tvLog('❌ MQTT Error: ' + err.message, 'error');
                    dot.className = 'status-indicator';
                });

                mqttClient.on('close', function() {
                    window.tvLog('⚠️ MQTT Connection Closed', 'warn');
                    dot.className = 'status-indicator';
                });
            } catch (e) {
                window.tvLog('🔥 MQTT Exception: ' + e.message, 'error');
            }
        }

        function handleMqttMessage(msgStr) {
            try {
                var data = JSON.parse(msgStr);
                if (data.url || data.pdfUrl) {
                    loadFile(data.url || data.pdfUrl);
                }
            } catch(e) {}
        }

        function loadFile(url) {
            if (!url) return;
            url = (url.indexOf('http') === 0) ? url : (BASE_URL + url);
            window.tvLog('📄 Loading: ' + url);
            document.getElementById('placeholder').style.display = 'none';
            ['pdfCanvas', 'imageDisplay', 'videoDisplay', 'agentScreenLayer'].forEach(function(id){
                document.getElementById(id).style.display = 'none';
            });

            var ext = url.split('?')[0].split('.').pop().toLowerCase();
            if (['mp4', 'webm'].indexOf(ext) >= 0) {
                var v = document.getElementById('videoDisplay');
                v.src = url;
                v.style.display = 'block';
            } else {
                var img = document.getElementById('imageDisplay');
                img.src = url;
                img.style.display = 'block';
            }
        }

        function startPolling() {
            setInterval(function() {
                var url = BASE_URL + '/api/screen/state?roomId=' + encodeURIComponent(STATUS_TOPIC);
                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            if (data && data.state && data.state.ts > lastScreenStateTs) {
                                lastScreenStateTs = data.state.ts;
                                handleMqttMessage(JSON.stringify(data.state));
                            }
                        } catch(e) {}
                    }
                };
                xhr.send();
            }, 3000);
        }
    </script>
</body>
</html>
