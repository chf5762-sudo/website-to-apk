<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XiaoMi Box 3S Full Logging</title>
    <script src="scripts/mqtt.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: "Microsoft YaHei", sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        #display-container { position: absolute; top: 0; left: 0; width: 100%; height: 65%; display: flex; align-items: center; justify-content: center; background: #000; z-index: 10; }
        #media-layer { width: 100%; height: 100%; display: none; background: #000; }
        canvas, img, video { max-width: 100%; max-height: 100%; }
        #tv-log { position: absolute; bottom: 0; left: 0; width: 100%; height: 35%; background: rgba(0,0,0,0.9); border-top: 1px solid #0f0; color: #0f0; font-size: 13px; padding: 5px; overflow-y: auto; z-index: 100; pointer-events: none; }
        .log-item { margin-bottom: 2px; }
        .step { color: #0cf; font-weight: bold; }
        .data { color: #ff0; }
        .error { color: #f44; }
    </style>
</head>
<body>
    <div id="display-container">
        <div id="placeholder"><h2 style="color: #444;">WAITING SIGNAL...</h2></div>
        <div id="media-layer"></div>
    </div>
    <div id="tv-log"></div>

    <script>
        function log(node, msg, type) {
            var p = document.getElementById('tv-log');
            var d = document.createElement('div');
            d.className = 'log-item ' + (type || '');
            d.innerHTML = '[' + new Date().toLocaleTimeString() + '] <span class="step">[' + node + ']</span> ' + msg;
            p.appendChild(d);
            p.scrollTop = p.scrollHeight;
        }

        var BEMFA_KEY = '3eb42d69d8b226abe22024d648975f8a';
        var MQTT_URL = 'wss://broker.emqx.io:8084/mqtt';
        var BASE_TOPIC = BEMFA_KEY + '/PPT001';
        
        window.onload = function() {
            log('INIT', 'System Start (Full Features)');
            
            // 1. ????
            var room = (new RegExp("[?&]room=([^var room = (new RegExp]+)").exec(location.search) || [])[1] || "admin"; // ?????? 123("[?&]room=([^&]+)").exec(location.search) || [])[1];
            var finalTopic = BASE_TOPIC;
            if (room) {
                log('ROOM', 'Detected Room ID: <span class="data">' + room + '</span>');
                // 2. ????
                var h = 2166136261;
                var input = BEMFA_KEY + ":" + room;
                for (var i = 0; i < input.length; i++) {
                    h ^= input.charCodeAt(i);
                    h = Math.imul(h, 16777619);
                }
                var sig = (h >>> 0).toString(16);
                while(sig.length < 8) sig = '0' + sig;
                finalTopic += "_" + room + "_" + sig;
                log('SIGN', 'Calculated Sig: <span class="data">' + sig + '</span>');
            }
            log('TOPIC', 'Target Topic: <span class="data">' + finalTopic + '</span>');

            // 3. MQTT ??
            var cid = 'TV_' + Math.floor(Math.random()*100000);
            log('MQTT', 'Connecting to EMQX via WSS:8084');
            try {
                var client = mqtt.connect(MQTT_URL, {
                    clientId: cid, clean: true, connectTimeout: 5000,
                    reconnectPeriod: 3000, protocolVersion: 4
                });

                client.on('connect', function() {
                    log('NET', 'MQTT Connected Success!', 'success');
                    client.subscribe(finalTopic);
                    log('SUB', 'Subscription Active for Topic');
                });

                client.on('message', function(t, m) {
                    var raw = m.toString();
                    log('RECV', 'Raw Data: <span class="data">' + raw + '</span>');
                    try {
                        var data = JSON.parse(raw);
                        handleAction(data);
                    } catch(e) { log('PARSE', 'JSON Parse Error: ' + e.message, 'error'); }
                });

                client.on('error', function(e) { log('ERR', 'MQTT Error: ' + e.message, 'error'); });
            } catch(e) { log('CRASH', 'Fatal Exception: ' + e.message, 'error'); }
        };

        function handleAction(data) {
            var layer = document.getElementById('media-layer');
            document.getElementById('placeholder').style.display = 'none';
            layer.style.display = 'block';
            layer.innerHTML = '';

            var url = data.u || data.url || data.pdfUrl;
            var type = data.t || data.type || 'image';
            if (url && url.indexOf('http') !== 0) url = 'http://easyshow.beundredig.eu.org' + url;

if(!url) return;
            log('ACTION', 'Type: <span class="data">' + type + '</span> | URL: <span class="data">' + url + '</span>');

            if (type === 'image' || (!type && url)) {
                layer.innerHTML = '<img src="' + url + '" style="width:100%; height:100%; object-fit:' + (data.fit || 'contain') + ';">';
            } else if (type === 'video') {
                layer.innerHTML = '<video src="' + url + '" autoplay controls style="width:100%; height:100%;"></video>';
            } else if (type === 'pdf') {
                log('PDF', 'Rendering Page: <span class="data">' + (data.pg || 1) + '</span>');
                layer.innerHTML = '<canvas id="pdf-canvas"></canvas>';
                renderPDF(url, data.pg || 1);
            }
        }

        function renderPDF(url, pg) {
            pdfjsLib.getDocument(url).promise.then(function(pdf) {
                pdf.getPage(pg).then(function(page) {
                    var canvas = document.getElementById('pdf-canvas');
                    var viewport = page.getViewport({ scale: 1.5 });
                    var context = canvas.getContext('2d');
                    canvas.height = viewport.height; canvas.width = viewport.width;
                    page.render({ canvasContext: context, viewport: viewport }).promise.then(function() {
                        log('PDF', 'Render Complete', 'success');
                    });
                });
            }).catch(function(e) { log('PDF', 'Load Error: ' + e.message, 'error'); });
        }
    </script>
</body>
</html>
