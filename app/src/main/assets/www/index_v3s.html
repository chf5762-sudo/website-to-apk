<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mirrored MQTT Debug</title>
    <script src="scripts/mqtt.min.js"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; padding: 0; overflow: hidden; }
        #log-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: #0f0; font-size: 16px; padding: 10px;
            overflow-y: auto; border: 2px solid #0f0;
        }
        .status-dot {
            position: fixed; top: 10px; right: 10px;
            width: 20px; height: 20px; border-radius: 50%;
            background: red;
        }
    </style>
</head>
<body>
    <div id="log-panel"></div>
    <div id="mqtt-dot" class="status-dot"></div>

    <script>
        function tvLog(msg, type) {
            var p = document.getElementById('log-panel');
            var d = document.createElement('div');
            d.style.color = (type === 'error') ? 'red' : (type === 'success' ? '#0f0' : '#fff');
            d.innerHTML = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            p.appendChild(d);
            p.scrollTop = p.scrollHeight;
        }

        // --- 完全镜像 HBuilder_TV_App 的参数 ---
        var MQTT_URL = 'wss://broker.emqx.io:8084/mqtt'; 
        var TOPIC = '3eb42d69d8b226abe22024d648975f8a/PPT001';
        var CLIENT_ID = 'TV_' + Math.floor(Math.random()*1000000);

        window.onload = function() {
            tvLog('=== MIRRORED VERSION START ===');
            
            if (typeof mqtt === 'undefined') {
                tvLog('ERROR: mqtt library not loaded!', 'error');
                return;
            }

            tvLog('Connecting to: ' + MQTT_URL);
            try {
                // 完全匹配成功版的 options
                var client = mqtt.connect(MQTT_URL, {
                    clientId: CLIENT_ID,
                    clean: true,
                    connectTimeout: 4000,
                    reconnectPeriod: 3000,
                    protocolVersion: 4
                });

                client.on('connect', function() {
                    tvLog('SUCCESS: CONNECTED TO BROKER!', 'success');
                    document.getElementById('mqtt-dot').style.background = 'green';
                    client.subscribe(TOPIC);
                    tvLog('Subscribed to: ' + TOPIC);
                });

                client.on('message', function(t, m) {
                    tvLog('MSG RECEIVED: ' + m.toString());
                });

                client.on('error', function(e) {
                    tvLog('MQTT ERROR: ' + e.message, 'error');
                });

                client.on('offline', function() {
                    tvLog('STATUS: Client Offline', 'error');
                });
            } catch (e) {
                tvLog('CRITICAL CRASH: ' + e.message, 'error');
            }
        };
    </script>
</body>
</html>
