    <h1 style="font-size: 5rem; margin-bottom: 40px; letter-spacing: 15px; font-weight: normal; color: #e6f1ff;">静夜思</h1>
    <p style="margin: 0; letter-spacing: 5px;">床前明月光，</p>
    <p style="margin: 0; letter-spacing: 5px;">疑是地上霜。</p>
    <p style="margin: 0; letter-spacing: 5px;">举头望明月，</p>
