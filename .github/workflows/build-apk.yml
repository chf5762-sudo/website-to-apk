name: Build APK
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - shell: bash
        run: |
          chmod +x make.sh
          printf "123456\n123456\nEasyShow\nTV\nDev\nCN\nyes\n" | ./make.sh keygen
          ./make.sh build app.conf
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./*.apk
