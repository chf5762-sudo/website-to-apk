name: Build APK (No HBuilder)

on:
  push:
    branches: [ "sync/hbuilder-tv-app-20260516" ]
  pull_request:
    branches: [ "sync/hbuilder-tv-app-20260516" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Prepare Cordova project
        run: |
          set -eux
          cordova create ci-build com.example.tvapp TVApp
          cd ci-build
          cordova platform add android

          rm -rf www/*
          rsync -av --delete ../ ./www/ \
            --exclude .git \
            --exclude .github \
            --exclude ci-build

      - name: Build debug APK
        run: |
          set -eux
          cd ci-build
          cordova build android --debug

      - name: Setup release signing files
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -eux
          cd ci-build
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > build.json <<EOF
          {
            "android": {
              "release": {
                "keystore": "release.keystore",
                "storePassword": "$ANDROID_KEYSTORE_PASSWORD",
                "alias": "$ANDROID_KEY_ALIAS",
                "password": "$ANDROID_KEY_PASSWORD",
                "keystoreType": ""
              }
            }
          }
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -eux
          cd ci-build
          cordova build android --release -- --packageType=apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvapp-cordova-debug-apk
          path: ci-build/platforms/android/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK artifact
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tvapp-cordova-release-apk
          path: ci-build/platforms/android/app/build/outputs/apk/release/*.apk
