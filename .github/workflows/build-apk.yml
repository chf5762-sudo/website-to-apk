name: Build APK
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build APK
        run: |
          chmod +x make.sh
          # Generate key if not exists (default password is '123456' as per README)
          ./make.sh keygen <<EOF
          123456
          123456
          EasyShow
          TV
          Dev
          CN
          yes
          EOF
          ./make.sh build app.conf
          
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: ./*.apk
