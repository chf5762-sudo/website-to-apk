name: Build APK (Debug Only)

on:
  push:
    branches: [ "sync/hbuilder-tv-app-20260516" ]
  pull_request:
    branches: [ "sync/hbuilder-tv-app-20260516" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build debug APK with Cordova (TV settings)
        run: |
          set -eux
          cordova create ci-build com.example.tvapp TVApp
          cd ci-build

          cat > config.xml <<'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.example.tvapp" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>TVApp</name>
            <description>Android TV app package from verified HBuilder assets.</description>
            <content src="index.html" />
            <access origin="*" />
            <allow-navigation href="*" />
            <preference name="orientation" value="landscape" />
            <preference name="Fullscreen" value="true" />

            <platform name="android">
              <allow-intent href="market:*" />

              <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">
                <application android:usesCleartextTraffic="true" />
              </edit-config>

              <config-file parent="/manifest" target="AndroidManifest.xml">
                <uses-permission android:name="android.permission.INTERNET" />
                <uses-permission android:name="android.permission.WAKE_LOCK" />
                <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
                <uses-feature android:name="android.software.leanback" android:required="false" />
              </config-file>

              <config-file parent="/manifest/application/activity[intent-filter/action/@android:name='android.intent.action.MAIN']" target="AndroidManifest.xml">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                </intent-filter>
              </config-file>
            </platform>
          </widget>
          EOF

          cordova platform add android

          rm -rf www/*
          rsync -av --delete ../ ./www/ \
            --exclude .git \
            --exclude .github \
            --exclude ci-build

          cordova build android --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvapp-cordova-debug-apk
          path: ci-build/platforms/android/app/build/outputs/apk/debug/*.apk
