name: Build APK
on:
  push:
    branches:
      - master
      - tencent-x5-empty
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Debug Log
        shell: bash
        run: |
          set -x
          # Ensure all scripts and configs are in LF format
          for f in make.sh gradlew app.conf; do
            tr -d '\r' < "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          chmod +x make.sh gradlew
          # Only remove the specific path that would crash the build
          sed -i 's/export ANDROID_HOME=.*//' make.sh
          printf "123456\n123456\nEasyShow\nTV\nDev\nCN\nyes\n" | ./make.sh keygen
          ./make.sh build app.conf
        continue-on-error: false
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./*.apk
