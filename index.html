<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT 远程显示端</title>
    <link rel="manifest" href="manifest-remote.json">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="观众版">
    <script src="./assets/vendor/mqtt.min.js"></script>
    <script src="./assets/vendor/pdf.min.js"></script>
    <script src="./assets/vendor/qrcode.min.js"></script>
    <script>
        window.addEventListener('error', function (e) { console.error('RuntimeError:', e.message); });
        window.addEventListener('unhandledrejection', function (e) { console.error('PromiseRejection:', e.reason); });
        if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = './assets/vendor/pdf.worker.min.js';
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 全局现代滚动条样式（深色适用） */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.5);
            border: 2px solid transparent;
            background-clip: content-box;
        }

        /* 顶部状态栏 - 包含页码和全屏控制 */
        .header {
            position: fixed;
            top: 40px;
            right: 40px;
            z-index: 1000;
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 5px 10px;
            border-radius: 8px;
            /* 正方形/稍圆角风格 */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 页码信息 */
        .page-info {
            color: white;
            font-size: 14px;
            font-weight: bold;
            font-family: inherit;
        }

        /* 全屏按钮 (兼作状态显示层) */
        .btn-fullscreen {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            /* 正方形风格 */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
            transition: all 0.3s;
            position: relative;
            /* 为了定位状态原点 */
        }

        .btn-fullscreen:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .status-indicator {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
            border: 2px solid rgba(0, 0, 0, 0.8);
            /* 边缘遮罩 */
            transition: all 0.3s;
        }

        /* 已连接 - 绿色 */
        .status-indicator.connected {
            background: #4caf50;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
            animation: pulse 2s infinite;
        }

        /* 连接中 - 黄色闪烁 */
        .status-indicator.connecting {
            background: #ffc107;
            animation: blink 1s infinite;
        }

        /* 错误/断开 - 红色 */
        .status-indicator.error {
            background: #f44336;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7);
            }

            50% {
                box-shadow: 0 0 0 4px rgba(76, 175, 80, 0);
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .status-text {
            color: #fff;
            font-size: 12px;
            opacity: 0.8;
        }

        .btn-disconnect {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn-disconnect:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 全屏预览容器 */
        .preview-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-screen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #agentScreenLayer {
            position: absolute;
            inset: 0;
            z-index: 260;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
        }

        .screen-idle-badge {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(40, 40, 40, 0.7);
            color: #aaa;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 300;
            display: none;
            pointer-events: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        #agentScreenLayer .screen-text {
            width: min(90vw, 1400px);
            max-height: 85vh;
            overflow: auto;
            font-size: clamp(28px, 4vw, 72px);
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            text-align: center;
            padding: 4vh 4vw;
        }

        #agentScreenLayer .screen-media,
        #agentScreenLayer .screen-frame {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
            background: #000;
        }

        #agentScreenLayer .screen-frame svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        #pdfCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 图片显示样式 */
        #imageDisplay {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        /* 视频显示样式 */
        #videoDisplay {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        /* 全屏模式下的优化 */
        body:fullscreen .preview-container,
        body:-webkit-full-screen .preview-container,
        body:-moz-full-screen .preview-container {
            background: #000;
        }

        body:fullscreen #pdfCanvas,
        body:-webkit-full-screen #pdfCanvas,
        body:-moz-full-screen #pdfCanvas {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }

        /* 全屏时隐藏控制按钮（可选） */
        body:fullscreen .header,
        body:-webkit-full-screen .header,
        body:-moz-full-screen .header {
            opacity: 0;
            transition: opacity 0.3s;
        }

        body:fullscreen .header:hover,
        body:-webkit-full-screen .header:hover,
        body:-moz-full-screen .header:hover {
            opacity: 1;
        }

        body:fullscreen .controls-container,
        body:-webkit-full-screen .controls-container,
        body:-moz-full-screen .controls-container {
            opacity: 0;
            transition: opacity 0.3s;
        }

        body:fullscreen .controls-container:hover,
        body:-webkit-full-screen .controls-container:hover,
        body:-moz-full-screen .controls-container:hover {
            opacity: 1;
        }

        .preview-placeholder {
            color: #666;
            text-align: center;
        }

        .preview-placeholder .icon {
            font-size: 64px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* 页码信息已经被并入 header 中，移除悬浮独立的样式，仅作微调如果需要 */

        /* 控制按钮容器 - 左下角悬浮 */
        .controls-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: none;
            /* 默认隐藏，除非主讲人允许 */
            flex-direction: column;
            gap: 15px;
            z-index: 300;
        }

        /* 主控制按钮组 */
        .controls-main {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 跳转控制 - 可展开 */
        .goto-container {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            pointer-events: none;
        }

        .controls-container:hover .goto-container {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .goto-input {
            width: 80px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            text-align: center;
        }

        .goto-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .goto-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-goto {
            padding: 8px 16px;
            background: rgba(103, 126, 234, 0.3);
            border: 1px solid rgba(103, 126, 234, 0.5);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-goto:hover {
            background: rgba(103, 126, 234, 0.5);
        }

        .btn-goto:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .controls-container {
                bottom: 20px;
                right: 20px;
            }

            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .controls-main {
                gap: 10px;
            }
        }

        /* 隐藏标题 */
        .preview-title {
            display: none;
        }

        /* ESC 退出提示 */
        .esc-hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 400;
            opacity: 0;
            opacity: 0;
            animation: fadeInOut 3s ease-in-out;
        }

        @keyframes fadeInOut {

            0%,
            100% {
                opacity: 0;
            }

            10%,
            90% {
                opacity: 1;
            }
        }

        /* 全屏时显示提示 */
        body:fullscreen .esc-hint {
            animation: fadeInOut 3s ease-in-out;
        }

        /* 主题信息显示层 - 透明磨玻璃灰色风格 */
        .tech-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.55);
            backdrop-filter: blur(40px) saturate(0.7);
            -webkit-backdrop-filter: blur(40px) saturate(0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .tech-card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 60px 80px;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .tech-card h1 {
            font-size: 48px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.92);
            margin: 20px 0;
            letter-spacing: 2px;
        }

        .info-meta {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.65);
            margin: 30px 0;
            font-weight: 400;
            letter-spacing: 1px;
        }

        #info-qrcode {
            margin: 40px auto;
            display: inline-block;
            padding: 16px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        #info-url {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5) !important;
            font-family: 'Courier New', monospace !important;
            word-break: break-all;
            padding: 0 20px;
        }

        #placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .pulse-ring-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pulse-ring {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            animation: pulse-ring 3s ease-in-out infinite;
        }

        .pulse-ring-outer {
            position: absolute;
            inset: -16px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 50%;
            animation: pulse-ring 3s ease-in-out infinite 0.5s;
        }

        .pulse-ring-count {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .pulse-ring-count .count-num {
            font-size: 32px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: -1px;
        }

        .pulse-ring-count .count-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 2px;
        }

        .placeholder-title {
            font-size: 22px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .placeholder-sub {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @keyframes pulse-ring {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.12);
                opacity: 0.2;
            }
        }
    </style>

    <style>
        /* --- 观众昵称弹窗 --- */
        #agora-chat-btn {
            display: none !important;
        }

        #nickname-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        #nickname-modal.hidden {
            display: none;
        }

        .nickname-box {
            background: white;
            border-radius: 16px;
            padding: 36px 40px;
            width: 340px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .nickname-title {
            font-size: 22px;
            font-weight: bold;
            color: #1565c0;
            margin-bottom: 8px;
        }

        .nickname-sub {
            font-size: 13px;
            color: #888;
            margin-bottom: 24px;
        }

        #nickname-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
            text-align: center;
        }

        #nickname-input:focus {
            border-color: #1976d2;
        }

        .nickname-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-enter {
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-enter:hover {
            background: #1565c0;
            transform: translateY(-2px);
        }

        .btn-skip {
            background: none;
            border: none;
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            padding: 4px;
        }

        .btn-skip:hover {
            color: #666;
        }
    </style>

    <!-- Agora 独立音视频模块 -->
    <link rel="stylesheet" href="agora-call.css">
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
    <script src="agora-call.js"></script>

    <!-- 引入提取出的玻璃拟态UI样式 -->
    <link rel="stylesheet" href="chat-glass-style.css">
</head>

<body>
    <!-- 观众昵称输入弹窗 -->
    <div id="nickname-modal">
        <div class="nickname-box">
            <div class="nickname-title">👋 欢迎加入会议</div>
            <div class="nickname-sub">输入您的昵称，或直接跳过由系统分配编号</div>
            <input id="nickname-input" type="text" placeholder="您的昵称（可不填）" maxlength="16"
                onkeydown="if(event.key==='Enter') confirmNickname()" autocomplete="off">
            <div class="nickname-btns">
                <button class="btn-enter" onclick="confirmNickname()">入場</button>
                <button class="btn-skip" onclick="skipNickname()">-- 跳过，使用随机编号 --</button>
            </div>
        </div>
    </div>

    <!-- 互动讨论侧边栏 -->
    <div id="discussion-sidebar">
        <div class="discussion-content">
            <div class="discussion-header"
                style="cursor:pointer; display:flex; justify-content:space-between; align-items:center; user-select:none;"
                onclick="toggleUserList()">
                <span style="display:flex;align-items:center;gap:6px;">
                    <span style="font-size:13px;">&#35752;&#35770;&#23631;</span>
                    <span id="online-count-badge"
                        style="font-size:11px; background:rgba(25,118,210,0.25); color:#90caf9; padding:2px 8px; border-radius:10px; font-weight:bold;">1
                        &#20154;</span>
                </span>
                <span id="user-list-arrow"
                    style="font-size:11px; opacity:0.4; transition:transform 0.2s;">&#9660;</span>
            </div>
            <div id="discussion-user-list" style="display: none;">
                <!-- ??????? -->
            </div>
            <div id="message-list">
                <!-- ???????????????? -->
            </div>
            <div class="discussion-input-area">
                <button type="button" title="&#21457;&#36865;&#25991;&#20214;"
                    onclick="document.getElementById('discussion-file-input').click()"
                    style="padding: 0 8px; font-size: 18px; border:none; background:none;">&#128206;</button>
                <input type="file" id="discussion-file-input" style="display: none;"
                    onchange="handleDiscussionFileUpload(this)">
                <input type="text" id="discussion-input" placeholder="&#36755;&#20837;&#28040;&#24687;..."
                    onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button onclick="sendChatMessage()"
                    style="background:#1976d2; color:white; border:none; border-radius:18px; padding: 5px 15px; cursor:pointer;">&#21457;&#36865;</button>
            </div>
        </div>
    </div>
    <button id="chat-fab" onclick="toggleDiscussion()" title="&#32842;&#22825;">&#128172;</button>

    <div class="tech-bg">
        <div class="tech-grid"></div>
    </div>

    <div class="header">
        <div class="page-info" id="pageInfo" style="display: none;"></div>
        <button class="btn-fullscreen" onclick="toggleFullscreen()" title="&#20840;&#23631;">
            &#9974;<div class="status-indicator" id="statusDot"></div>
        </button>
    </div>

    <div class="preview-container">
        <div class="preview-screen" id="previewScreen">
            <canvas id="pdfCanvas" style="max-width: 100%; max-height: 100%; display: none;"></canvas>
            <!-- 涂鸦层 -->
            <canvas id="drawCanvas"
                style="position:absolute; top:0; left:0; pointer-events:none; display:none; z-index:2147483645;"></canvas>

            <img id="imageDisplay" style="max-width: 100%; max-height: 100%; object-fit: contain; display: none;" />
            <video id="videoDisplay" style="max-width: 100%; max-height: 100%; object-fit: contain; display: none;"
                controls autoplay></video>
            <div id="agentScreenLayer"></div>
            <div id="screenIdleBadge" class="screen-idle-badge">系统闲置中</div>

            <div id="placeholder">
                <div class="pulse-ring-outer"></div>

                        <button onclick="copyMeetingLink()"
                            style="margin-bottom:20px; padding:12px 30px; background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.25); border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.3);"
                            onmouseover="this.style.background='rgba(255,255,255,0.25)'; this.style.transform='translateY(-2px)';"
                            onmouseout="this.style.background='rgba(255,255,255,0.15)'; this.style.transform='translateY(0)';">
